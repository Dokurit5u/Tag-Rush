<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KINETIC // 2D Parkour & Tag Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090c12;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      touch-action: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .pad-pressed {
      transform: scale(0.92);
      filter: brightness(1.35);
    }
  </style>
</head>
<body class="bg-[#090c12] text-slate-200 antialiased">

  <!-- FULL-VIEWPORT PLAYABLE ARENA CANVAS -->
  <canvas id="gameCanvas" class="fixed inset-0 w-full h-full block"></canvas>

  <!-- ISOLATED 'SHOW HUD' PILL (VISIBLE ONLY WHEN 'HIDE HUD' IS ACTIVE) -->
  <button id="btnShowHudOnly" type="button" class="hidden fixed top-2 right-2 z-50 px-3 py-1.5 rounded-full bg-[#090c12]/92 hover:bg-slate-900 text-[#00f0ff] border border-[#00f0ff]/75 font-mono text-[11px] font-bold tracking-wider shadow-[0_0_18px_rgba(0,240,255,0.35)] backdrop-blur-md active:scale-95">
    SHOW HUD
  </button>

  <!-- SUBTLE DISMISSIBLE PORTRAIT ORIENTATION HINT -->
  <div id="portraitBanner" class="hidden fixed top-[102px] left-1/2 -translate-x-1/2 z-40 w-[92vw] max-w-md bg-amber-500/15 border border-amber-400/50 backdrop-blur-md rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 shadow-lg">
    <div class="flex items-center gap-2 text-xs text-amber-200 font-medium">
      <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      <span>Rotate to <strong>Landscape</strong> for wide chase & parkour visibility.</span>
    </div>
    <button id="btnDismissPortrait" type="button" class="text-amber-300 hover:text-white font-mono text-[11px] font-bold px-2 py-0.5 rounded bg-amber-500/25 shrink-0">
      OK
    </button>
  </div>

  <!-- MAIN HUD ROOT -->
  <div id="hudRoot" class="fixed inset-0 pointer-events-none z-30">

    <!-- 1. SINGLE COMPACT LANDSCAPE TOP BAR (HEIGHT: 44px, NEVER WRAPS OR OVERLAPS) -->
    <header class="fixed top-1.5 left-1.5 right-1.5 h-[44px] pointer-events-auto bg-[#090c12]/92 backdrop-blur-md border border-slate-800/90 rounded-xl px-2 flex items-center justify-between gap-1.5 shadow-xl">
      
      <!-- LEFT GROUP: Mode Toggle, Role Toggle, & 4 Character Archetype Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink min-w-0">
        <!-- Mode Toggle: TAG ARENA / FREE SANDBOX -->
        <button id="btnModeToggle" type="button" class="px-2 py-1 rounded-lg font-mono text-[10px] sm:text-[11px] font-extrabold border transition whitespace-nowrap shrink-0">
          TAG ARENA
        </button>

        <!-- Role Toggle: RUNNER / CHASER -->
        <button id="btnRoleToggle" type="button" class="px-2 py-1 rounded-lg font-mono text-[10px] sm:text-[11px] font-extrabold border transition whitespace-nowrap shrink-0 flex items-center gap-1">
          <span id="roleDot" class="w-1.5 h-1.5 rounded-full"></span>
          <span id="roleLabel">RUNNER</span>
        </button>

        <div class="h-4 w-px bg-slate-800 shrink-0"></div>

        <!-- 4 Character Archetype Pills -->
        <button data-arch="strider" type="button" class="arch-btn px-2 py-1 rounded-lg font-mono text-[10px] font-bold border transition whitespace-nowrap shrink-0">
          STRIDER
        </button>
        <button data-arch="breacher" type="button" class="arch-btn px-2 py-1 rounded-lg font-mono text-[10px] font-bold border transition whitespace-nowrap shrink-0">
          BREACHER
        </button>
        <button data-arch="acrobat" type="button" class="arch-btn px-2 py-1 rounded-lg font-mono text-[10px] font-bold border transition whitespace-nowrap shrink-0">
          ACROBAT
        </button>
        <button data-arch="phantom" type="button" class="arch-btn px-2 py-1 rounded-lg font-mono text-[10px] font-bold border transition whitespace-nowrap shrink-0">
          PHANTOM
        </button>
      </div>

      <!-- RIGHT GROUP: RESET & HIDE HUD -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btnResetMatch" type="button" class="px-2 py-1 rounded-lg font-mono text-[10px] sm:text-[11px] font-bold bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-emerald-500/40 transition whitespace-nowrap">
          RESET
        </button>
        <button id="btnHideHud" type="button" class="px-2 py-1 rounded-lg font-mono text-[10px] sm:text-[11px] font-extrabold bg-[#00f0ff]/15 hover:bg-[#00f0ff]/25 text-[#00f0ff] border border-[#00f0ff]/50 transition whitespace-nowrap">
          HIDE HUD
        </button>
      </div>
    </header>

    <!-- 2. SECOND SLIM TELEMETRY STRIP (HEIGHT: 26px) + COMPACT 220M ARENA RADAR BAR -->
    <div class="fixed top-[51px] left-1/2 -translate-x-1/2 pointer-events-none flex flex-col items-center gap-1 max-w-[97vw]">
      <div class="h-[26px] px-3 rounded-full bg-[#090c12]/90 backdrop-blur-md border border-slate-800/90 flex items-center gap-2 sm:gap-3 font-mono text-[10px] sm:text-[11px] shadow-lg whitespace-nowrap overflow-x-auto no-scrollbar max-w-full">
        <div class="flex items-center gap-1">
          <span class="text-slate-500">SPD:</span>
          <span id="topSpeedVal" class="font-bold text-white tabular-nums">0.0 m/s</span>
        </div>
        <span class="text-slate-700">|</span>
        <div class="flex items-center gap-1">
          <span id="topStateBadge" class="font-bold text-[#00f0ff]">IDLE</span>
        </div>
        <span class="text-slate-700">|</span>
        <div class="flex items-center gap-1">
          <span class="text-slate-500">SONAR:</span>
          <span id="statusSonar" class="font-bold text-emerald-400 tabular-nums">20.0s</span>
        </div>
        <span class="text-slate-700">|</span>
        <div class="flex items-center gap-1">
          <span class="text-slate-500">RUNNERS:</span>
          <span id="statusRunnersAlive" class="font-bold text-white tabular-nums">4/4</span>
        </div>
        <div id="statusRoundTimerWrap" class="flex items-center gap-1">
          <span class="text-slate-700">|</span>
          <span class="text-slate-500">TIME:</span>
          <span id="statusRoundTimer" class="font-bold text-amber-400 tabular-nums">02:00</span>
        </div>
        <div id="statusPowerupWrap" class="hidden flex items-center gap-1">
          <span class="text-slate-700">|</span>
          <span id="statusPowerup" class="font-bold text-amber-300">OVERDRIVE</span>
        </div>
      </div>

      <!-- Compact 220m Arena Radar Strip showing all 5 players' live positions -->
      <div id="arenaRadarStrip" class="relative w-[240px] sm:w-[320px] h-[12px] rounded-full bg-[#090c12]/88 border border-slate-800/90 backdrop-blur-md shadow overflow-hidden">
        <div class="absolute inset-y-0 left-1/4 w-px bg-slate-800"></div>
        <div class="absolute inset-y-0 left-1/2 w-px bg-slate-700"></div>
        <div class="absolute inset-y-0 left-3/4 w-px bg-slate-800"></div>
        <div id="radarDotsLayer" class="absolute inset-0"></div>
      </div>
    </div>

    <!-- ROUND RESULT OVERLAY (TAG ARENA MODE) -->
    <div id="roundResultBanner" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-auto z-40 bg-[#090c12]/95 border border-slate-700 rounded-2xl px-6 py-5 text-center shadow-2xl backdrop-blur-lg max-w-sm w-[88vw]">
      <div id="roundResultTag" class="font-mono text-xs font-bold tracking-widest uppercase mb-1 text-[#00f0ff]">ROUND COMPLETE</div>
      <h2 id="roundResultTitle" class="text-xl font-extrabold text-white mb-1.5">RUNNERS WIN!</h2>
      <p id="roundResultDesc" class="text-xs text-slate-400 mb-4">All runners survived until the clock reached zero.</p>
      <button id="btnNextRound" type="button" class="w-full py-2.5 px-4 rounded-xl bg-[#00f0ff] hover:bg-cyan-300 text-slate-950 font-mono text-xs font-bold tracking-wider transition active:scale-95">
        PLAY NEXT ROUND
      </button>
    </div>

    <!-- 3. BOTTOM-CENTER SLIDE-HOP SWEET-SPOT GAUGE & SKILL BAR -->
    <div class="fixed bottom-2.5 left-1/2 -translate-x-1/2 pointer-events-none flex flex-col items-center gap-1.5 z-20">
      <!-- Dynamic Slide-Hop Sweet-Spot Timing Bar (Appears whenever sliding!) -->
      <div id="slideHopCueBox" class="hidden px-2.5 py-1 rounded-full bg-[#090c12]/92 border border-amber-400/80 backdrop-blur-md shadow-lg flex items-center gap-2">
        <span class="font-mono text-[10px] font-bold text-amber-300 whitespace-nowrap">SLIDE-HOP</span>
        <div class="relative w-24 sm:w-28 h-2.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
          <!-- Golden sweet spot 0.04s to 0.50s out of 0.65s -->
          <div class="absolute top-0 bottom-0 bg-amber-400/35 border-x border-amber-400" style="left: 6%; width: 71%;"></div>
          <div id="slideHopCursor" class="absolute top-0 bottom-0 w-1 bg-[#00f0ff] shadow-[0_0_6px_#00f0ff]" style="left: 0%"></div>
        </div>
        <span class="font-mono text-[10px] font-bold text-white whitespace-nowrap">[JUMP]</span>
      </div>

      <!-- Compact Skill & Combo Pill -->
      <div class="px-3 py-1.5 rounded-2xl bg-[#090c12]/90 border border-slate-800/90 backdrop-blur-md shadow-xl flex items-center gap-2.5 font-mono text-xs whitespace-nowrap">
        <span id="hudChainPill" class="hidden px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/45 text-[10px] font-bold tabular-nums">
          CHAIN x1
        </span>
        <button id="hudSkillBtn" type="button" class="pointer-events-auto flex items-center gap-1.5 active:scale-95">
          <span id="hudSkillName" class="text-[10px] font-bold text-[#00f0ff]">BLINK [E]</span>
          <div class="w-16 sm:w-24 h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
            <div id="hudSkillFill" class="h-full bg-[#00f0ff]" style="width: 100%"></div>
          </div>
        </button>
      </div>
    </div>

    <!-- 4. ERGONOMIC MULTI-TOUCH MOBILE CONTROLS + DESKTOP CLICK FALLBACKS -->
    <!-- Bottom-Left: Continuous Multi-Touch Directional Pads (< and >) -->
    <div id="dpadZone" class="fixed bottom-2.5 left-2.5 pointer-events-auto flex items-center gap-2.5 touch-none">
      <button id="btnTouchLeft" type="button" aria-label="Run Left" class="w-[70px] h-[70px] rounded-2xl bg-[#090c12]/88 border-2 border-slate-700/90 text-slate-200 flex items-center justify-center shadow-xl transition-transform">
        <svg class="w-8 h-8 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="btnTouchRight" type="button" aria-label="Run Right" class="w-[70px] h-[70px] rounded-2xl bg-[#090c12]/88 border-2 border-slate-700/90 text-slate-200 flex items-center justify-center shadow-xl transition-transform">
        <svg class="w-8 h-8 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Bottom-Right: Spaced SKILL, SLIDE, and JUMP Buttons -->
    <div class="fixed bottom-2.5 right-2.5 pointer-events-auto flex items-end gap-2.5 touch-none">
      <button id="btnTouchSkill" type="button" aria-label="Special Skill" class="w-[58px] h-[58px] rounded-2xl bg-[#090c12]/88 border-2 border-purple-500/85 text-purple-300 font-mono text-[11px] font-extrabold flex flex-col items-center justify-center shadow-xl transition-transform">
        <span>SKILL</span>
        <span class="text-[9px] opacity-75">[E]</span>
      </button>
      <button id="btnTouchSlide" type="button" aria-label="Slide" class="w-[70px] h-[66px] rounded-2xl bg-[#090c12]/88 border-2 border-[#00f0ff]/90 text-[#00f0ff] font-mono text-xs font-extrabold flex flex-col items-center justify-center shadow-xl transition-transform">
        <span>SLIDE</span>
        <span class="text-[9px] opacity-75">[S]</span>
      </button>
      <button id="btnTouchJump" type="button" aria-label="Jump" class="w-[74px] h-[74px] rounded-2xl bg-[#090c12]/88 border-2 border-emerald-400/90 text-emerald-300 font-mono text-xs font-extrabold flex flex-col items-center justify-center shadow-xl transition-transform">
        <span>JUMP</span>
        <span class="text-[9px] opacity-75">[SPC]</span>
      </button>
    </div>

  </div>

  <script>
    /**
     * KINETIC // 2D PARKOUR & TAG ARENA
     * =========================================================================
     * Single Explicit Pixel-Space Coordinate System:
     *   - 1 meter = 42 pixels (PPM = 42)
     *   - World Floor = WORLD_FLOOR_Y = 620
     *   - World Width = WORLD_WIDTH = 9240 (220 meters looping seamlessly)
     *   - 4 deterministic physics sub-steps per frame with Number.isFinite() guards
     *   - Dynamic per-frame canvas size check + ctx.setTransform(1,0,0,1,0,0) reset
     */
    (() => {
      'use strict';

      // =======================================================================
      // 1. SINGLE EXPLICIT PIXEL-SPACE WORLD CONSTANTS
      // =======================================================================
      const PPM = 42;                            // 1 meter = 42 pixels
      const WORLD_METERS = 220;                  // 220 meters total loop
      const WORLD_WIDTH = WORLD_METERS * PPM;    // 9240 pixels
      const WORLD_FLOOR_Y = 620;                 // Fixed world floor Y coordinate
      const SUBSTEPS = 4;                        // 4 deterministic physics sub-steps per frame

      const STAND_W = 26;
      const STAND_H = 56;
      const SLIDE_H = 26;

      const COLORS = {
        bg: '#090c12',
        runner: '#00f0ff',
        chaser: '#ff2e55',
        parkour: '#10b981',
        amber: '#f59e0b',
        purple: '#a855f7',
        gold: '#fbbf24',
      };

      const PHYSICS = {
        maxSprintSpeed: 11.2,      // m/s
        accelRate: 38.0,           // m/s^2
        slideMinLaunch: 10.8,      // m/s guaranteed minimum slide burst even from standstill
        slideBoostMult: 1.24,      // momentum multiplier
        slideFriction: 4.5,        // m/s^2 decay
        kongVaultBoost: 2.6,       // +m/s burst on timed Kong Vault
        baseGravity: 29.0,         // m/s^2
        fallGravityMult: 1.44,     // snappy downward gravity
        baseJumpSpeed: 11.8,       // m/s
        coyoteTimeSec: 0.14,       // 140ms ledge forgiveness
        jumpBufferSec: 0.15,       // 150ms pre-land jump buffer
        slideBufferSec: 0.18,      // 180ms pre-land slide buffer
        vaultSnapSec: 0.20,        // 200ms Kong Vault window
        sonarInterval: 20.0,       // 20s global Sonar Pulse sweep
      };

      const ARCHETYPES = {
        strider: {
          id: 'strider',
          name: 'STRIDER',
          skillName: 'BLINK [E]',
          accent: '#00f0ff',
          speedMult: 1.18,         // +18% top sprint speed
          accelMult: 1.18,
          jumpMult: 1.00,
          slideFricMult: 0.72,     // Longer slides
          airControlMult: 1.32,
          vaultSpeedMult: 1.25,
          maxWallKicks: 1,
          canWallBash: false,
          skillCooldown: 6.0,
        },
        breacher: {
          id: 'breacher',
          name: 'BREACHER',
          skillName: 'BASH [E]',
          accent: '#ff2e55',
          speedMult: 1.04,
          accelMult: 0.96,
          jumpMult: 0.98,
          slideFricMult: 0.88,
          airControlMult: 0.95,
          vaultSpeedMult: 1.05,
          maxWallKicks: 1,
          canWallBash: true,       // Smashes through red destructible walls automatically
          skillCooldown: 6.5,
        },
        acrobat: {
          id: 'acrobat',
          name: 'ACROBAT',
          skillName: 'SKY VAULT [E]',
          accent: '#10b981',
          speedMult: 1.03,
          accelMult: 1.06,
          jumpMult: 1.18,         // ~+38% jump height
          slideFricMult: 0.94,
          airControlMult: 1.28,
          vaultSpeedMult: 1.18,
          maxWallKicks: 2,         // Double mid-air wall-kicks
          canWallBash: false,
          skillCooldown: 5.5,
        },
        phantom: {
          id: 'phantom',
          name: 'PHANTOM',
          skillName: 'DECOY [E]',
          accent: '#a855f7',
          speedMult: 1.08,
          accelMult: 1.08,
          jumpMult: 1.04,
          slideFricMult: 0.84,
          airControlMult: 1.15,
          vaultSpeedMult: 1.12,
          maxWallKicks: 1,
          canWallBash: false,
          skillCooldown: 7.5,
        }
      };

      // =======================================================================
      // 2. SAFE CANVAS ROUNDED RECTANGLE HELPER (NO ctx.roundRect ANYWHERE)
      // =======================================================================
      function drawRoundRect(ctx, x, y, w, h, r, fill, stroke) {
        const radius = Math.max(0, Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5));
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      // =======================================================================
      // 3. GAME & CAMERA STATE
      // =======================================================================
      const gameState = {
        mode: 'ARENA',             // 'ARENA' | 'SANDBOX'
        humanRole: 'RUNNER',       // 'RUNNER' | 'CHASER'
        humanArchetype: 'strider',
        hudHidden: false,
        portraitDismissed: false,

        roundTimeRemaining: 120.0, // 02:00 match clock
        roundOver: false,
        sonarTimer: 20.0,
        sonarRevealTimer: 0,
        sonarRings: [],
      };

      const camera = {
        x: 1200,
        y: WORLD_FLOOR_Y - 110,
        zoom: 1.0,
      };

      // =======================================================================
      // 4. 220M (9240PX) MULTI-TIERED URBAN PARKOUR ARENA GEOMETRY
      // =======================================================================
      const solids = [
        // Continuous solid world floor at WORLD_FLOOR_Y = 620 (zero infinite bottomless pits)
        { x: 0, y: WORLD_FLOOR_Y, w: WORLD_WIDTH, h: 240, type: 'ground' },

        // Zone 1: Overhead Bazaar Canopy Walk
        { x: 640,  y: 482, w: 360, h: 22, type: 'rooftop' },

        // Zone 2: Launch Deck & Low Slide-Under Tunnels
        // Tunnel bottom is at y = 584 (WORLD_FLOOR_Y - 36). Slide height is 26px (passes cleanly), standing is 56px (blocked).
        { x: 1740, y: 568, w: 180, h: 52,  type: 'platform' },
        { x: 1960, y: 464, w: 310, h: 120, type: 'tunnel' },
        { x: 2480, y: 454, w: 400, h: 130, type: 'tunnel' },

        // Zone 3: Multi-Tiered Skyline Rooftop Chain (with Slide-Hop gaps between roofs)
        { x: 3260, y: 568, w: 130, h: 52,  type: 'platform' },
        { x: 3420, y: 516, w: 440, h: 24,  type: 'rooftop' },
        { x: 4140, y: 498, w: 420, h: 24,  type: 'rooftop' },
        { x: 4860, y: 480, w: 380, h: 24,  type: 'rooftop' },

        // Zone 4: Vertical Wall-Kick Shaft & High Skybridge
        { x: 5520, y: 270, w: 28,  h: 294, type: 'wall' },
        { x: 5720, y: 290, w: 28,  h: 330, type: 'wall' },
        { x: 5720, y: 290, w: 460, h: 24,  type: 'rooftop' },

        // Zone 5: Overpass & Bypass Slide Tunnel
        { x: 6880, y: 496, w: 400, h: 24,  type: 'rooftop' },
        { x: 8060, y: 464, w: 290, h: 120, type: 'tunnel' },
      ];

      const ramps = [
        { x1: 1560, y1: WORLD_FLOOR_Y, x2: 1740, y2: 568 },
        { x1: 6700, y1: WORLD_FLOOR_Y, x2: 6880, y2: 496 },
      ];

      // Waist-High Vault Market Stalls / Crates (42px tall)
      const vaultCrates = [
        { x: 420,  y: WORLD_FLOOR_Y - 42, w: 66, h: 42 },
        { x: 1140, y: WORLD_FLOOR_Y - 44, w: 72, h: 44 },
        { x: 2340, y: WORLD_FLOOR_Y - 42, w: 66, h: 42 },
        { x: 3780, y: 516 - 40,           w: 60, h: 40 },
        { x: 4480, y: 498 - 40,           w: 60, h: 40 },
        { x: 5320, y: WORLD_FLOOR_Y - 42, w: 68, h: 42 },
        { x: 7480, y: WORLD_FLOOR_Y - 44, w: 70, h: 44 },
        { x: 8760, y: WORLD_FLOOR_Y - 42, w: 68, h: 42 },
      ];

      // Spring Bounce Pads
      const bouncePads = [
        { x: 540,  y: WORLD_FLOOR_Y - 14, w: 56, h: 14, boostVy: -17.2 * PPM, pulse: 0 },
        { x: 4040, y: WORLD_FLOOR_Y - 14, w: 58, h: 14, boostVy: -17.8 * PPM, pulse: 0 },
        { x: 6460, y: WORLD_FLOOR_Y - 14, w: 58, h: 14, boostVy: -17.5 * PPM, pulse: 0 },
      ];

      // Red Destructible Breacher Walls
      const destructibleWalls = [
        { id: 'dw1', x: 7780, y: WORLD_FLOOR_Y - 96, w: 30, h: 96, broken: false, respawnTimer: 0 },
        { id: 'dw2', x: 8500, y: WORLD_FLOOR_Y - 96, w: 30, h: 96, broken: false, respawnTimer: 0 },
      ];

      // =======================================================================
      // 5. WRAPPED WORLD COORDINATE HELPERS & BOUNDED COLLISION QUERIES
      // =======================================================================
      function wrapX(x) {
        if (!Number.isFinite(x)) return 1200;
        let wx = x % WORLD_WIDTH;
        if (wx < 0) wx += WORLD_WIDTH;
        return wx;
      }

      function wrappedDeltaX(fromX, toX) {
        let dx = (toX - fromX) % WORLD_WIDTH;
        if (dx > WORLD_WIDTH * 0.5) dx -= WORLD_WIDTH;
        if (dx < -WORLD_WIDTH * 0.5) dx += WORLD_WIDTH;
        return dx;
      }

      function getNearbyBoxes(list, px, range) {
        const out = [];
        for (let i = 0; i < list.length; i++) {
          const item = list[i];
          if (item.broken) continue;
          for (let offset = -WORLD_WIDTH; offset <= WORLD_WIDTH; offset += WORLD_WIDTH) {
            const ix = item.x + offset;
            if (ix + item.w >= px - range && ix <= px + range) {
              out.push({
                x: ix,
                y: item.y,
                w: item.w,
                h: item.h,
                type: item.type,
                boostVy: item.boostVy,
                rawRef: item
              });
            }
          }
        }
        return out;
      }

      function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function checkCeilingObstructed(px, slideBottomY, slideW) {
        const topY = slideBottomY - STAND_H;
        const botY = slideBottomY - SLIDE_H;
        const nearby = getNearbyBoxes(solids, px, 260);
        for (let i = 0; i < nearby.length; i++) {
          const s = nearby[i];
          if (aabbOverlap(px + 2, topY, slideW - 4, botY - topY, s.x, s.y, s.w, s.h)) {
            return true;
          }
        }
        return false;
      }

      function getRampSurfaceY(centerX, footY) {
        for (let i = 0; i < ramps.length; i++) {
          const r = ramps[i];
          for (let offset = -WORLD_WIDTH; offset <= WORLD_WIDTH; offset += WORLD_WIDTH) {
            const x1 = r.x1 + offset;
            const x2 = r.x2 + offset;
            if (centerX >= x1 - 4 && centerX <= x2 + 4) {
              const span = Math.max(1, x2 - x1);
              const t = Math.max(0, Math.min(1, (centerX - x1) / span));
              const ry = r.y1 + t * (r.y2 - r.y1);
              if (Math.abs(footY - ry) <= 22) return ry;
            }
          }
        }
        return null;
      }

      function findGroundShadowY(ent) {
        const cx = ent.x + ent.w * 0.5;
        const footY = ent.y + ent.h;
        let bestY = WORLD_FLOOR_Y;

        const rampY = getRampSurfaceY(cx, footY);
        if (rampY !== null && rampY >= footY - 8 && rampY < bestY) {
          bestY = rampY;
        }

        const nearbySolids = getNearbyBoxes(solids, ent.x, 120);
        for (let i = 0; i < nearbySolids.length; i++) {
          const s = nearbySolids[i];
          if (cx >= s.x && cx <= s.x + s.w && s.y >= footY - 8 && s.y < bestY) {
            bestY = s.y;
          }
        }

        const nearbyCrates = getNearbyBoxes(vaultCrates, ent.x, 120);
        for (let i = 0; i < nearbyCrates.length; i++) {
          const c = nearbyCrates[i];
          if (cx >= c.x && cx <= c.x + c.w && c.y >= footY - 8 && c.y < bestY) {
            bestY = c.y;
          }
        }

        return bestY;
      }

      // =======================================================================
      // 6. BOUNDED VISUAL EFFECTS POOLS
      // =======================================================================
      const particles = [];
      const afterimages = [];
      const shockwaves = [];
      const popups = [];

      function spawnParticle(x, y, vx, vy, color, size, life, gravity) {
        if (particles.length > 220) particles.shift();
        particles.push({ x, y, vx, vy, color, size, life, maxLife: life, gravity: gravity || 500 });
      }

      function spawnShockwave(x, y, color, maxRadius) {
        if (shockwaves.length > 35) shockwaves.shift();
        shockwaves.push({ x, y, color, radius: 6, maxRadius: maxRadius || 68, life: 0.35, maxLife: 0.35 });
      }

      function spawnPopup(x, y, text, color) {
        if (popups.length > 25) popups.shift();
        popups.push({ x, y, text, color, vy: -52, life: 1.0, maxLife: 1.0 });
      }

      function spawnWallDebris(wall, dir) {
        for (let i = 0; i < 20; i++) {
          const px = wall.x + Math.random() * wall.w;
          const py = wall.y + Math.random() * wall.h;
          const vx = (dir || 1) * (180 + Math.random() * 440);
          const vy = -140 - Math.random() * 260;
          spawnParticle(px, py, vx, vy, i % 2 === 0 ? '#ff2e55' : '#fda4af', 3 + Math.random() * 4, 0.55 + Math.random() * 0.3, 950);
        }
      }

      // =======================================================================
      // 7. ENTITY FACTORY & SAFETY SANITIZATION
      // =======================================================================
      const entities = [];
      let humanPlayer = null;

      function sanitizeEntity(ent) {
        if (!Number.isFinite(ent.x)) ent.x = 1200;
        if (!Number.isFinite(ent.y)) ent.y = WORLD_FLOOR_Y - ent.h;
        if (!Number.isFinite(ent.vx)) ent.vx = 0;
        if (!Number.isFinite(ent.vy)) ent.vy = 0;
        if (ent.y > WORLD_FLOOR_Y - ent.h) {
          ent.y = WORLD_FLOOR_Y - ent.h;
          if (ent.vy > 0) ent.vy = 0;
          ent.grounded = true;
        }
        if (ent.y < -600) {
          ent.y = -600;
          if (ent.vy < 0) ent.vy = 0;
        }
      }

      function createRunnerEntity(opts) {
        const arch = ARCHETYPES[opts.archetype] || ARCHETYPES.strider;
        const scarfNodes = [];
        for (let i = 0; i < 6; i++) {
          scarfNodes.push({ x: opts.x, y: opts.y + 14 });
        }

        return {
          id: opts.id,
          name: opts.name,
          isHuman: !!opts.isHuman,
          isDecoy: !!opts.isDecoy,
          role: opts.role, // 'RUNNER' | 'CHASER'
          archetypeKey: arch.id,
          archetype: arch,

          x: opts.x,
          y: opts.y,
          w: STAND_W,
          h: STAND_H,
          vx: 0,
          vy: 0,
          facing: opts.facing || 1,
          state: 'IDLE',
          grounded: true,
          ceilingLocked: false,

          // Tag & Power-up State
          taggedOut: false,
          respawnTimer: 0,
          spawnProtection: 1.5,
          decoyLife: opts.decoyLife || 0,
          stealthTimer: 0,
          activePowerup: null, // 'OVERDRIVE' | 'LONG_ARM' | 'SKYBOUND'
          powerupTimer: 0,

          // Controller Inputs
          ctrl: {
            left: false,
            right: false,
            slideHeld: false,
            jumpHeld: false,
            jumpPressed: false,
            slidePressed: false,
            skillPressed: false,
          },

          // Timers & Forgiveness Buffers
          stateTime: 0,
          slideTime: 0,
          coyoteTimer: 0,
          jumpBufferTimer: 0,
          slideBufferTimer: 0, // 180ms pre-land slide buffer
          vaultSnapTimer: 0,
          wallCoyoteTimer: 0,
          lastWallNormal: 0,
          wallClimbTime: 0,
          wallKicksUsed: 0,

          // Traversal Spline Interpolation
          traversalType: null,
          traversalTimer: 0,
          traversalDuration: 0.20,
          traversalStartX: 0,
          traversalStartY: 0,
          traversalTargetX: 0,
          traversalTargetY: 0,
          traversalExitVx: 0,

          // Special Ability Charge
          skillCharge: 1.0,

          // Animation & Telemetry
          chainCount: 0,
          chainDecayTimer: 0,
          stridePhase: Math.random() * Math.PI * 2,
          torsoLean: 0,
          squashY: 1,
          ghostTimer: 0,
          scarf: scarfNodes,

          // AI Memory
          aiDecisionTimer: 0,
          aiPreferredDir: Math.random() < 0.5 ? 1 : -1,
          aiJumpCooldown: 0,
          aiSlideTimer: 0,
        };
      }

      function rebuildEntities() {
        entities.length = 0;

        const botConfigs = [
          { name: 'BOT 1', arch: 'strider',  x: 820 },
          { name: 'BOT 2', arch: 'breacher', x: 1840 },
          { name: 'BOT 3', arch: 'acrobat',  x: 3480 },
          { name: 'BOT 4', arch: 'phantom',  x: 4920 },
        ];

        const humanStartX = gameState.humanRole === 'CHASER' ? 220 : 1380;
        humanPlayer = createRunnerEntity({
          id: 'human',
          name: 'YOU',
          isHuman: true,
          role: gameState.humanRole,
          archetype: gameState.humanArchetype,
          x: humanStartX,
          y: WORLD_FLOOR_Y - STAND_H,
          facing: 1,
        });
        entities.push(humanPlayer);

        // In TAG ARENA mode, ensure 1 Chaser + 4 Runners; in FREE SANDBOX mode, all bots are Runners
        let chaserAssigned = gameState.mode === 'SANDBOX' || gameState.humanRole === 'CHASER';
        for (let i = 0; i < botConfigs.length; i++) {
          const cfg = botConfigs[i];
          let role = 'RUNNER';
          if (!chaserAssigned && i === 0) {
            role = 'CHASER';
            chaserAssigned = true;
          }
          const spawnX = role === 'CHASER' ? 220 : cfg.x;
          entities.push(createRunnerEntity({
            id: `bot_${i}`,
            name: role === 'CHASER' ? 'CHASER' : cfg.name,
            isHuman: false,
            role,
            archetype: cfg.arch,
            x: spawnX,
            y: WORLD_FLOOR_Y - STAND_H,
            facing: 1,
          }));
        }

        // Initialize camera directly on the player's spawn coordinates BEFORE frame 0 renders!
        camera.x = humanPlayer.x + 140;
        camera.y = humanPlayer.y - 60;
        camera.zoom = 1.0;
      }

      // =======================================================================
      // 8. RESPONSIVE TOUCH & KEYBOARD CONTROLS (SLIDE FIX + MULTI-TOUCH)
      // =======================================================================
      const rawInput = {
        left: false,
        right: false,
        slideHeld: false,
        jumpHeld: false,
      };

      function triggerHumanJumpDown() {
        if (!humanPlayer) return;
        rawInput.jumpHeld = true;
        humanPlayer.ctrl.jumpPressed = true;
        humanPlayer.jumpBufferTimer = PHYSICS.jumpBufferSec;
        humanPlayer.vaultSnapTimer = PHYSICS.vaultSnapSec;
      }

      function triggerHumanJumpUp() {
        rawInput.jumpHeld = false;
      }

      function triggerHumanSlideDown() {
        if (!humanPlayer) return;
        if (!rawInput.slideHeld) {
          humanPlayer.ctrl.slidePressed = true;
        }
        rawInput.slideHeld = true;
        humanPlayer.slideBufferTimer = PHYSICS.slideBufferSec; // 180ms pre-land slide buffer
      }

      function triggerHumanSlideUp() {
        rawInput.slideHeld = false;
      }

      function triggerHumanSkill() {
        if (!humanPlayer) return;
        humanPlayer.ctrl.skillPressed = true;
      }

      // Keyboard Listeners
      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
          e.preventDefault();
        }
        if (e.repeat) return;

        switch (e.code) {
          case 'KeyA':
          case 'ArrowLeft':
            rawInput.left = true;
            break;
          case 'KeyD':
          case 'ArrowRight':
            rawInput.right = true;
            break;
          case 'KeyS':
          case 'ArrowDown':
          case 'ShiftLeft':
          case 'ShiftRight':
            triggerHumanSlideDown();
            break;
          case 'Space':
          case 'KeyW':
          case 'ArrowUp':
            triggerHumanJumpDown();
            break;
          case 'KeyE':
          case 'KeyF':
            triggerHumanSkill();
            break;
          case 'Digit1':
            setHumanArchetype('strider');
            break;
          case 'Digit2':
            setHumanArchetype('breacher');
            break;
          case 'Digit3':
            setHumanArchetype('acrobat');
            break;
          case 'Digit4':
            setHumanArchetype('phantom');
            break;
          case 'KeyR':
            initMatch();
            break;
        }
      });

      window.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyA':
          case 'ArrowLeft':
            rawInput.left = false;
            break;
          case 'KeyD':
          case 'ArrowRight':
            rawInput.right = false;
            break;
          case 'KeyS':
          case 'ArrowDown':
          case 'ShiftLeft':
          case 'ShiftRight':
            triggerHumanSlideUp();
            break;
          case 'Space':
          case 'KeyW':
          case 'ArrowUp':
            triggerHumanJumpUp();
            break;
        }
      });

      // Continuous Multi-Touch Thumb Sliding D-Pad (< and >)
      const dpadZone = document.getElementById('dpadZone');
      const btnTouchLeft = document.getElementById('btnTouchLeft');
      const btnTouchRight = document.getElementById('btnTouchRight');
      let dpadTouchId = null;
      let dpadMouseDown = false;

      function applyDpadClientX(clientX) {
        const leftRect = btnTouchLeft.getBoundingClientRect();
        const rightRect = btnTouchRight.getBoundingClientRect();
        const midX = (leftRect.right + rightRect.left) * 0.5;
        if (clientX <= midX) {
          rawInput.left = true;
          rawInput.right = false;
          btnTouchLeft.classList.add('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
          btnTouchRight.classList.remove('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
        } else {
          rawInput.left = false;
          rawInput.right = true;
          btnTouchRight.classList.add('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
          btnTouchLeft.classList.remove('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
        }
      }

      function resetDpadVisuals() {
        dpadTouchId = null;
        dpadMouseDown = false;
        rawInput.left = false;
        rawInput.right = false;
        btnTouchLeft.classList.remove('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
        btnTouchRight.classList.remove('pad-pressed', 'border-[#00f0ff]', 'text-[#00f0ff]');
      }

      dpadZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.changedTouches.length > 0) {
          const t = e.changedTouches[0];
          dpadTouchId = t.identifier;
          applyDpadClientX(t.clientX);
        }
      }, { passive: false });

      dpadZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === dpadTouchId) {
            applyDpadClientX(t.clientX);
            break;
          }
        }
      }, { passive: false });

      const onDpadTouchEnd = (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === dpadTouchId) {
            resetDpadVisuals();
            break;
          }
        }
      };
      dpadZone.addEventListener('touchend', onDpadTouchEnd, { passive: false });
      dpadZone.addEventListener('touchcancel', onDpadTouchEnd, { passive: false });

      dpadZone.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dpadMouseDown = true;
        applyDpadClientX(e.clientX);
      });
      window.addEventListener('mousemove', (e) => {
        if (dpadMouseDown) applyDpadClientX(e.clientX);
      });
      window.addEventListener('mouseup', () => {
        if (dpadMouseDown) resetDpadVisuals();
      });

      // Multi-Touch Action Buttons (SKILL, SLIDE, JUMP)
      function bindMultiTouchButton(btnEl, onDown, onUp) {
        let activeTouchId = null;

        btnEl.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (e.changedTouches.length > 0) {
            activeTouchId = e.changedTouches[0].identifier;
            btnEl.classList.add('pad-pressed');
            onDown();
          }
        }, { passive: false });

        const handleEnd = (e) => {
          e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === activeTouchId) {
              activeTouchId = null;
              btnEl.classList.remove('pad-pressed');
              if (onUp) onUp();
              break;
            }
          }
        };
        btnEl.addEventListener('touchend', handleEnd, { passive: false });
        btnEl.addEventListener('touchcancel', handleEnd, { passive: false });

        btnEl.addEventListener('mousedown', (e) => {
          e.preventDefault();
          btnEl.classList.add('pad-pressed');
          onDown();
        });
        btnEl.addEventListener('mouseup', () => {
          btnEl.classList.remove('pad-pressed');
          if (onUp) onUp();
        });
        btnEl.addEventListener('mouseleave', () => {
          btnEl.classList.remove('pad-pressed');
          if (onUp) onUp();
        });
      }

      bindMultiTouchButton(document.getElementById('btnTouchSlide'), triggerHumanSlideDown, triggerHumanSlideUp);
      bindMultiTouchButton(document.getElementById('btnTouchJump'), triggerHumanJumpDown, triggerHumanJumpUp);
      bindMultiTouchButton(document.getElementById('btnTouchSkill'), triggerHumanSkill, null);

      // =======================================================================
      // 9. INTELLIGENT PARKOUR AI BOTS (4 BOTS)
      // =======================================================================
      function updateAIBot(bot, dt) {
        if (bot.taggedOut) return;

        if (bot.isDecoy) {
          bot.decoyLife -= dt;
          bot.ctrl.left = bot.facing < 0;
          bot.ctrl.right = bot.facing > 0;
          bot.ctrl.slideHeld = false;
          bot.ctrl.jumpHeld = false;
          senseAndNavigateObstacles(bot, bot.facing, false);
          return;
        }

        bot.aiDecisionTimer -= dt;
        if (bot.aiJumpCooldown > 0) bot.aiJumpCooldown -= dt;
        if (bot.aiSlideTimer > 0) {
          bot.aiSlideTimer -= dt;
          bot.ctrl.slideHeld = true;
        } else {
          bot.ctrl.slideHeld = false;
        }

        let desiredDir = bot.aiPreferredDir;
        let wantsHighPath = false;

        if (bot.role === 'CHASER') {
          let bestTarget = null;
          let bestScore = Infinity;
          for (let i = 0; i < entities.length; i++) {
            const other = entities[i];
            if (other === bot || other.role !== 'RUNNER' || other.taggedOut) continue;
            const dx = wrappedDeltaX(bot.x, other.x);
            const dy = other.y - bot.y;
            const dist = Math.hypot(dx, dy) + (other.isDecoy ? 180 : 0);
            if (dist < bestScore) {
              bestScore = dist;
              bestTarget = other;
            }
          }

          if (bestTarget) {
            const dx = wrappedDeltaX(bot.x, bestTarget.x);
            desiredDir = dx >= 0 ? 1 : -1;
            wantsHighPath = bestTarget.y < bot.y - 42;
            if (Math.abs(dx) < 340 && bot.skillCharge >= 1.0) {
              bot.ctrl.skillPressed = true;
            }
          }
        } else {
          let chaser = null;
          for (let i = 0; i < entities.length; i++) {
            if (entities[i].role === 'CHASER') { chaser = entities[i]; break; }
          }

          if (chaser && gameState.mode === 'ARENA') {
            const dxToChaser = wrappedDeltaX(bot.x, chaser.x);
            const dist = Math.hypot(dxToChaser, chaser.y - bot.y);
            if (dist < 1600) {
              desiredDir = dxToChaser >= 0 ? -1 : 1;
              wantsHighPath = chaser.y >= bot.y - 24;
              if (dist < 250 && bot.skillCharge >= 1.0) {
                bot.ctrl.skillPressed = true;
              }
            } else if (bot.aiDecisionTimer <= 0) {
              bot.aiDecisionTimer = 2.2 + Math.random() * 2.5;
              if (Math.random() < 0.25) bot.aiPreferredDir *= -1;
              desiredDir = bot.aiPreferredDir;
            }
          } else if (bot.aiDecisionTimer <= 0) {
            bot.aiDecisionTimer = 2.5 + Math.random() * 3.0;
            if (Math.random() < 0.22) bot.aiPreferredDir *= -1;
            desiredDir = bot.aiPreferredDir;
          }
        }

        bot.aiPreferredDir = desiredDir;
        bot.ctrl.left = desiredDir < 0;
        bot.ctrl.right = desiredDir > 0;

        senseAndNavigateObstacles(bot, desiredDir, wantsHighPath);
      }

      function senseAndNavigateObstacles(bot, dir, wantsHighPath) {
        const speedPx = Math.abs(bot.vx);
        const lookAhead = 54 + speedPx * 0.22;
        const footY = bot.y + bot.h;

        // 1. Low Overhead Tunnels -> Slide!
        const nearbySolids = getNearbyBoxes(solids, bot.x, 380);
        for (let i = 0; i < nearbySolids.length; i++) {
          const s = nearbySolids[i];
          if (s.type === 'tunnel') {
            const tunnelBottom = s.y + s.h;
            const inFront = dir > 0
              ? (s.x - (bot.x + bot.w) >= -24 && s.x - (bot.x + bot.w) <= lookAhead + 30)
              : (bot.x - (s.x + s.w) >= -24 && bot.x - (s.x + s.w) <= lookAhead + 30);
            if (inFront && footY > tunnelBottom && footY - tunnelBottom < 65) {
              bot.ctrl.slidePressed = true;
              bot.ctrl.slideHeld = true;
              bot.slideBufferTimer = PHYSICS.slideBufferSec;
              bot.aiSlideTimer = 0.48;
              return;
            }
          }
        }

        // 2. Waist-High Vault Crates -> Kong Vault!
        const nearbyCrates = getNearbyBoxes(vaultCrates, bot.x, 260);
        for (let i = 0; i < nearbyCrates.length; i++) {
          const st = nearbyCrates[i];
          const distFront = dir > 0 ? st.x - (bot.x + bot.w) : bot.x - (st.x + st.w);
          if (distFront >= 0 && distFront <= 65 && Math.abs(footY - (st.y + st.h)) < 20) {
            bot.ctrl.jumpPressed = true;
            bot.vaultSnapTimer = PHYSICS.vaultSnapSec;
            return;
          }
        }

        // 3. Red Destructible Walls -> Breacher smashes through, others jump over
        const nearbyWalls = getNearbyBoxes(destructibleWalls, bot.x, 260);
        for (let i = 0; i < nearbyWalls.length; i++) {
          const cw = nearbyWalls[i];
          const distFront = dir > 0 ? cw.x - (bot.x + bot.w) : bot.x - (cw.x + cw.w);
          if (distFront >= 0 && distFront <= 88 && !bot.archetype.canWallBash && bot.grounded && bot.aiJumpCooldown <= 0) {
            bot.ctrl.jumpPressed = true;
            bot.jumpBufferTimer = PHYSICS.jumpBufferSec;
            bot.aiJumpCooldown = 0.45;
            return;
          }
        }

        // 4. Elevated Rooftops & Bounce Pads
        if ((wantsHighPath || Math.random() < 0.022) && bot.grounded && bot.aiJumpCooldown <= 0) {
          for (let i = 0; i < nearbySolids.length; i++) {
            const s = nearbySolids[i];
            if (s.type === 'rooftop' || s.type === 'platform') {
              const dxPlat = dir > 0 ? s.x - bot.x : (s.x + s.w) - bot.x;
              if (dxPlat * dir > 12 && dxPlat * dir < 165 && s.y < footY - 28 && s.y > footY - 165) {
                bot.ctrl.jumpPressed = true;
                bot.jumpBufferTimer = PHYSICS.jumpBufferSec;
                bot.aiJumpCooldown = 0.55;
                return;
              }
            }
          }
        }

        // 5. Airborne Wall-Kick
        if (!bot.grounded && bot.wallCoyoteTimer > 0 && bot.aiJumpCooldown <= 0) {
          bot.ctrl.jumpPressed = true;
          bot.jumpBufferTimer = PHYSICS.jumpBufferSec;
          bot.aiJumpCooldown = 0.25;
        }
      }

      // =======================================================================
      // 10. KINEMATIC CHARACTER CONTROLLER (4 SUB-STEPS PER FRAME)
      // =======================================================================
      function getEffectiveMaxSprintPx(ent) {
        let mult = ent.archetype.speedMult;
        if (ent.role === 'CHASER') {
          mult *= 1.04;
          if (ent.activePowerup === 'OVERDRIVE') mult *= 1.26;
        }
        return PHYSICS.maxSprintSpeed * mult * PPM;
      }

      function setEntityHeight(ent, newH) {
        if (ent.h === newH) return;
        const bottom = ent.y + ent.h;
        ent.h = newH;
        ent.y = bottom - newH;
      }

      function addChainBonus(ent, label, color) {
        ent.chainCount += 1;
        ent.chainDecayTimer = 3.2;
        ent.skillCharge = Math.min(1.0, ent.skillCharge + 0.16);
        if (ent.isHuman && label) {
          spawnPopup(ent.x + ent.w * 0.5, ent.y - 20, `${label} x${ent.chainCount}`, color);
        }
      }

      function activateSpecialSkill(ent) {
        if (ent.skillCharge < 1.0 || ent.taggedOut) return;
        ent.skillCharge = 0;

        const maxSprintPx = getEffectiveMaxSprintPx(ent);
        const dir = ent.facing || 1;
        const cx = ent.x + ent.w * 0.5;
        const cy = ent.y + ent.h * 0.5;

        switch (ent.archetypeKey) {
          case 'strider': {
            ent.state = 'DASH_SKILL';
            ent.stateTime = 0;
            ent.vx = dir * maxSprintPx * 1.9;
            ent.vy = Math.min(ent.vy, 0);
            ent.spawnProtection = Math.max(ent.spawnProtection, 0.55);
            spawnShockwave(cx, cy, '#00f0ff', 88);
            if (ent.isHuman) spawnPopup(cx, ent.y - 20, 'BLINK DASH!', '#00f0ff');
            for (let i = 0; i < 14; i++) {
              spawnParticle(cx, cy, -dir * (140 + Math.random() * 260), (Math.random() - 0.5) * 160, '#00f0ff', 4, 0.4, 120);
            }
            break;
          }
          case 'breacher': {
            ent.state = 'DASH_SKILL';
            ent.stateTime = 0;
            ent.vx = dir * maxSprintPx * 1.65;
            spawnShockwave(cx, cy, '#ff2e55', 98);
            if (ent.isHuman) spawnPopup(cx, ent.y - 20, 'JUGGERNAUT BASH!', '#ff2e55');
            for (let i = 0; i < entities.length; i++) {
              const other = entities[i];
              if (other === ent || other.taggedOut) continue;
              const dx = wrappedDeltaX(ent.x, other.x);
              if (Math.abs(dx) < 140 && Math.abs(other.y - ent.y) < 80) {
                other.vx = (dx >= 0 ? 1 : -1) * 14 * PPM;
                other.vy = -7.5 * PPM;
                other.grounded = false;
              }
            }
            break;
          }
          case 'acrobat': {
            const jumpVel = PHYSICS.baseJumpSpeed * ent.archetype.jumpMult * PPM;
            ent.grounded = false;
            ent.state = 'WALL_KICK';
            ent.stateTime = 0;
            ent.vy = -jumpVel * 1.18;
            ent.vx = dir * Math.max(Math.abs(ent.vx), maxSprintPx * 1.15);
            ent.squashY = 1.28;
            spawnShockwave(cx, ent.y + ent.h, '#10b981', 84);
            if (ent.isHuman) spawnPopup(cx, ent.y - 20, 'SKY VAULT!', '#10b981');
            break;
          }
          case 'phantom': {
            ent.stealthTimer = 3.5;
            spawnShockwave(cx, cy, '#a855f7', 78);
            if (ent.isHuman) spawnPopup(cx, ent.y - 20, 'HOLO DECOY!', '#a855f7');
            const decoyDir = -dir;
            const decoy = createRunnerEntity({
              id: `decoy_${Date.now()}_${Math.random()}`,
              name: 'HOLO DECOY',
              isHuman: false,
              isDecoy: true,
              role: 'RUNNER',
              archetype: 'phantom',
              x: ent.x,
              y: ent.y,
              facing: decoyDir,
              decoyLife: 4.5,
            });
            decoy.vx = decoyDir * maxSprintPx * 1.12;
            entities.push(decoy);
            break;
          }
        }
      }

      function initiateJump(ent, type) {
        let jumpMult = ent.archetype.jumpMult;
        if (ent.role === 'CHASER' && ent.activePowerup === 'SKYBOUND') {
          jumpMult *= 1.38;
        }
        const jumpVel = PHYSICS.baseJumpSpeed * jumpMult * PPM;
        const maxSprintPx = getEffectiveMaxSprintPx(ent);
        const speedPx = Math.abs(ent.vx);
        const moveDir = (ent.ctrl.right ? 1 : 0) - (ent.ctrl.left ? 1 : 0);
        const dir = moveDir !== 0 ? moveDir : (speedPx > 12 ? Math.sign(ent.vx) : ent.facing);

        ent.grounded = false;
        ent.coyoteTimer = 0;
        ent.jumpBufferTimer = 0;
        setEntityHeight(ent, STAND_H);
        ent.ceilingLocked = false;
        ent.squashY = 1.24;

        if (type === 'LONG_JUMP') {
          ent.state = 'LONG_JUMP';
          ent.stateTime = 0;
          ent.vy = -jumpVel * 0.80;
          ent.vx = dir * Math.max(speedPx * 1.12, maxSprintPx * 1.26);
          ent.facing = dir;
          addChainBonus(ent, 'SLIDE-HOP!', '#fbbf24');
          spawnShockwave(ent.x + ent.w * 0.5, ent.y + ent.h, '#fbbf24', 66);
          for (let i = 0; i < 12; i++) {
            spawnParticle(ent.x + ent.w * 0.5, ent.y + ent.h, -dir * (90 + Math.random() * 160), -35 - Math.random() * 90, '#fbbf24', 3.5, 0.38, 260);
          }
        } else {
          ent.state = 'JUMP_RISE';
          ent.stateTime = 0;
          ent.vy = -jumpVel;
          if (moveDir !== 0 && speedPx < maxSprintPx * 0.62) {
            ent.vx = moveDir * Math.max(speedPx, maxSprintPx * 0.62);
            ent.facing = moveDir;
          }
        }
      }

      function initiateVault(ent, obstacle, isKong) {
        const maxSprintPx = getEffectiveMaxSprintPx(ent);
        const dir = ent.vx >= 0 ? 1 : -1;
        const curSpeed = Math.max(Math.abs(ent.vx), maxSprintPx * 0.94);

        setEntityHeight(ent, STAND_H);
        ent.ceilingLocked = false;
        ent.grounded = false;
        ent.jumpBufferTimer = 0;
        ent.vaultSnapTimer = 0;

        ent.traversalType = isKong ? 'KONG_VAULT' : 'VAULT';
        ent.state = ent.traversalType;
        ent.stateTime = 0;
        ent.traversalTimer = 0;
        ent.traversalDuration = Math.max(0.10, (isKong ? 0.17 : 0.21) / ent.archetype.vaultSpeedMult);
        ent.traversalStartX = ent.x;
        ent.traversalStartY = ent.y;
        ent.traversalTargetX = dir > 0 ? (obstacle.x + obstacle.w + 8) : (obstacle.x - ent.w - 8);
        ent.traversalTargetY = (obstacle.y + obstacle.h) - STAND_H;

        const bonusPx = isKong ? (PHYSICS.kongVaultBoost * PPM) : 0;
        ent.traversalExitVx = dir * (curSpeed + bonusPx);
        ent.vx = ent.traversalExitVx;
        ent.vy = 0;

        if (isKong) {
          addChainBonus(ent, 'KONG VAULT!', '#00f0ff');
          spawnShockwave(obstacle.x + obstacle.w * 0.5, obstacle.y, '#00f0ff', 76);
        }
      }

      function initiateMantle(ent, ledgeBox, dir) {
        setEntityHeight(ent, STAND_H);
        ent.ceilingLocked = false;
        ent.grounded = false;
        ent.jumpBufferTimer = 0;
        ent.wallKicksUsed = 0;

        ent.traversalType = 'MANTLE';
        ent.state = 'MANTLE';
        ent.stateTime = 0;
        ent.traversalTimer = 0;
        ent.traversalDuration = Math.max(0.10, 0.16 / ent.archetype.vaultSpeedMult);
        ent.traversalStartX = ent.x;
        ent.traversalStartY = ent.y;
        ent.traversalTargetX = dir > 0 ? (ledgeBox.x + 10) : (ledgeBox.x + ledgeBox.w - ent.w - 10);
        ent.traversalTargetY = ledgeBox.y - STAND_H;
        ent.traversalExitVx = dir * Math.max(Math.abs(ent.vx) * 0.92, getEffectiveMaxSprintPx(ent) * 0.80);
        ent.vx = ent.traversalExitVx;
        ent.vy = 0;
        addChainBonus(ent, 'MANTLE', '#10b981');
      }

      function initiateWallKick(ent, wallNormal) {
        const jumpVel = PHYSICS.baseJumpSpeed * ent.archetype.jumpMult * PPM;
        const maxSprintPx = getEffectiveMaxSprintPx(ent);
        const kickSpeed = Math.max(maxSprintPx * 0.96, Math.abs(ent.vx) * 0.95);

        ent.state = 'WALL_KICK';
        ent.stateTime = 0;
        ent.grounded = false;
        ent.wallCoyoteTimer = 0;
        ent.jumpBufferTimer = 0;
        ent.wallKicksUsed += 1;
        ent.facing = wallNormal;
        ent.vx = wallNormal * kickSpeed;
        ent.vy = -jumpVel * 0.96;
        ent.squashY = 1.22;

        addChainBonus(ent, 'WALL-KICK!', '#ff2e55');
        spawnShockwave(wallNormal > 0 ? ent.x : ent.x + ent.w, ent.y + ent.h * 0.5, '#ff2e55', 58);
      }

      function enterSlideState(ent, moveDir, maxSprintPx) {
        const wasSkid = ent.state === 'SKID';
        const slideDir = wasSkid && moveDir !== 0
          ? moveDir
          : (Math.abs(ent.vx) > 15 ? Math.sign(ent.vx) : (moveDir !== 0 ? moveDir : ent.facing));

        ent.facing = slideDir;
        setEntityHeight(ent, SLIDE_H);
        ent.state = 'SLIDE';
        ent.stateTime = 0;
        ent.slideTime = 0;
        ent.slideBufferTimer = 0;
        ent.squashY = 0.72;

        // Crisp forward slide burst even from standstill or slow walk!
        const speedPx = Math.abs(ent.vx);
        const minLaunchPx = PHYSICS.slideMinLaunch * PPM;
        const boosted = Math.min(
          Math.max(speedPx * PHYSICS.slideBoostMult, minLaunchPx),
          maxSprintPx * PHYSICS.slideBoostMult * 1.22
        );
        ent.vx = slideDir * boosted;

        if (wasSkid && ent.isHuman) {
          spawnPopup(ent.x + ent.w * 0.5, ent.y - 18, 'SKID-CANCEL!', '#00f0ff');
        }
        for (let i = 0; i < 10; i++) {
          spawnParticle(ent.x + ent.w * 0.5, ent.y + ent.h, -slideDir * (70 + Math.random() * 150), -18 - Math.random() * 60, '#00f0ff', 3, 0.34, 220);
        }
      }

      function stepEntityPhysics(ent, dt) {
        if (ent.taggedOut) {
          if (gameState.mode === 'SANDBOX') {
            ent.respawnTimer -= dt;
            if (ent.respawnTimer <= 0) {
              ent.taggedOut = false;
              ent.spawnProtection = 1.8;
              ent.x = wrapX((humanPlayer ? humanPlayer.x : 0) + 1100 + Math.random() * 2800);
              ent.y = WORLD_FLOOR_Y - STAND_H;
              ent.vx = 0;
              ent.vy = 0;
              ent.state = 'IDLE';
              spawnShockwave(ent.x + ent.w * 0.5, ent.y + ent.h * 0.5, '#00f0ff', 72);
            }
          }
          return;
        }

        // Update timers
        ent.stateTime += dt;
        if (ent.spawnProtection > 0) ent.spawnProtection = Math.max(0, ent.spawnProtection - dt);
        if (ent.stealthTimer > 0) ent.stealthTimer = Math.max(0, ent.stealthTimer - dt);
        if (ent.powerupTimer > 0) {
          ent.powerupTimer = Math.max(0, ent.powerupTimer - dt);
          if (ent.powerupTimer === 0) ent.activePowerup = null;
        }

        if (ent.coyoteTimer > 0) ent.coyoteTimer = Math.max(0, ent.coyoteTimer - dt);
        if (ent.jumpBufferTimer > 0) ent.jumpBufferTimer = Math.max(0, ent.jumpBufferTimer - dt);
        if (ent.slideBufferTimer > 0) ent.slideBufferTimer = Math.max(0, ent.slideBufferTimer - dt);
        if (ent.vaultSnapTimer > 0) ent.vaultSnapTimer = Math.max(0, ent.vaultSnapTimer - dt);
        if (ent.wallCoyoteTimer > 0) ent.wallCoyoteTimer = Math.max(0, ent.wallCoyoteTimer - dt);

        if (ent.chainCount > 0) {
          ent.chainDecayTimer -= dt;
          if (ent.chainDecayTimer <= 0) ent.chainCount = 0;
        }

        ent.skillCharge = Math.min(1.0, ent.skillCharge + dt / ent.archetype.skillCooldown);
        ent.squashY += (1 - ent.squashY) * Math.min(1, dt * 16);

        if (ent.ctrl.skillPressed) {
          ent.ctrl.skillPressed = false;
          activateSpecialSkill(ent);
        }

        const moveDir = (ent.ctrl.right ? 1 : 0) - (ent.ctrl.left ? 1 : 0);
        const maxSprintPx = getEffectiveMaxSprintPx(ent);
        const accelPx = PHYSICS.accelRate * ent.archetype.accelMult * PPM;
        const baseGravPx = PHYSICS.baseGravity * PPM;

        // 1. SEMI-AUTOMATED TRAVERSAL (VAULT / KONG_VAULT / MANTLE)
        if (ent.state === 'VAULT' || ent.state === 'KONG_VAULT' || ent.state === 'MANTLE') {
          ent.traversalTimer += dt;
          const dur = Math.max(0.08, ent.traversalDuration);
          const t = Math.max(0, Math.min(1, ent.traversalTimer / dur));
          // Safe linear-quadratic blend (zero fractional Math.pow on negative numbers!)
          const invT = 1 - t;
          const easeX = 1 - invT * invT;
          const arcLift = ent.traversalType === 'MANTLE'
            ? 0
            : Math.sin(t * Math.PI) * (ent.traversalType === 'KONG_VAULT' ? 16 : 22);

          ent.x = ent.traversalStartX + (ent.traversalTargetX - ent.traversalStartX) * easeX;
          ent.y = ent.traversalStartY + (ent.traversalTargetY - ent.traversalStartY) * t - arcLift;
          ent.vx = ent.traversalExitVx;
          ent.vy = 0;

          if (t >= 1) {
            ent.x = ent.traversalTargetX;
            ent.y = ent.traversalTargetY;
            ent.traversalType = null;
            ent.grounded = true;
            ent.wallKicksUsed = 0;
            ent.state = Math.abs(ent.vx) > 14 ? 'SPRINT' : 'IDLE';
            ent.stateTime = 0;
          }

          sanitizeEntity(ent);
          finalizeEntityAnimation(ent, dt, maxSprintPx);
          return;
        }

        // 2. SLIDE ENTRY, SLIDE-LOCK & 180MS PRE-LAND SLIDE BUFFER
        const speedPx = Math.abs(ent.vx);
        if (ent.grounded) {
          if (ent.state === 'SLIDE') {
            ent.slideTime += dt;
            ent.ceilingLocked = checkCeilingObstructed(ent.x, ent.y + ent.h, ent.w);

            if (!ent.ctrl.slideHeld && !ent.ceilingLocked && (ent.slideTime > 0.25 || speedPx < 2.8 * PPM)) {
              setEntityHeight(ent, STAND_H);
              ent.state = speedPx > 14 ? 'SPRINT' : 'IDLE';
              ent.stateTime = 0;
              ent.slideTime = 0;
            } else if (!ent.ceilingLocked && speedPx < 2.2 * PPM) {
              setEntityHeight(ent, STAND_H);
              ent.state = 'IDLE';
              ent.stateTime = 0;
              ent.slideTime = 0;
            }
          } else if (ent.ctrl.slidePressed || ent.slideBufferTimer > 0 || (ent.ctrl.slideHeld && speedPx > 1.8 * PPM)) {
            enterSlideState(ent, moveDir, maxSprintPx);
          }
        }

        // 3. JUMP / SLIDE-HOP LONG-JUMP (0.04s - 0.50s) / WALL-KICK
        if (ent.jumpBufferTimer > 0) {
          if (ent.grounded || ent.coyoteTimer > 0) {
            if (ent.state === 'SLIDE' && ent.slideTime >= 0.04 && ent.slideTime <= 0.50 && !ent.ceilingLocked) {
              initiateJump(ent, 'LONG_JUMP');
            } else if (!ent.ceilingLocked) {
              initiateJump(ent, 'NORMAL');
            }
          } else if (ent.wallCoyoteTimer > 0 && ent.wallKicksUsed < ent.archetype.maxWallKicks) {
            initiateWallKick(ent, ent.lastWallNormal);
          }
        }

        // 4. HORIZONTAL VELOCITY & FRICTION
        if (ent.state === 'DASH_SKILL') {
          if (ent.stateTime > 0.20) {
            ent.state = ent.grounded ? 'SPRINT' : 'FALL';
          }
        } else if (ent.state === 'SLIDE') {
          const slideDir = Math.sign(ent.vx) || ent.facing;
          const frictionDecel = PHYSICS.slideFriction * ent.archetype.slideFricMult * PPM;
          let newSpeed = Math.max(0, Math.abs(ent.vx) - frictionDecel * dt);
          if (ent.ceilingLocked && newSpeed < 4.8 * PPM) {
            newSpeed = 4.8 * PPM;
          }
          ent.vx = slideDir * newSpeed;
        } else if (ent.grounded) {
          if (moveDir !== 0) {
            ent.facing = moveDir;
            const currentDir = Math.sign(ent.vx);
            const curSpeed = Math.abs(ent.vx);

            if (currentDir !== 0 && currentDir !== moveDir && curSpeed > maxSprintPx * 0.75) {
              ent.state = 'SKID';
              ent.vx += moveDir * (accelPx * 1.45) * dt;
              if (Math.random() < 0.35) {
                spawnParticle(ent.x + ent.w * 0.5, ent.y + ent.h - 2, currentDir * 100, -45, '#f59e0b', 2.5, 0.24, 420);
              }
            } else {
              const ratio = curSpeed / maxSprintPx;
              const effAccel = accelPx * (ratio < 0.70 ? 1.35 : (ratio < 1.0 ? 1.0 - ((ratio - 0.70) / 0.30) * 0.55 : 1.0));
              if (curSpeed < maxSprintPx) {
                ent.vx += moveDir * effAccel * dt;
                if (Math.sign(ent.vx) === moveDir && Math.abs(ent.vx) > maxSprintPx) {
                  ent.vx = moveDir * maxSprintPx;
                }
              } else {
                const overDrag = 3.8 * PPM;
                ent.vx = moveDir * Math.max(maxSprintPx, curSpeed - overDrag * dt);
              }
              if (Math.abs(ent.vx) > 14) ent.state = 'SPRINT';
            }
          } else {
            const stopDecel = accelPx * 1.3;
            if (Math.abs(ent.vx) <= stopDecel * dt) {
              ent.vx = 0;
              ent.state = 'IDLE';
            } else {
              ent.vx -= Math.sign(ent.vx) * stopDecel * dt;
              ent.state = 'SPRINT';
            }
          }
        } else {
          const airAccel = accelPx * 0.68 * ent.archetype.airControlMult;
          if (moveDir !== 0) {
            ent.facing = moveDir;
            const curSpeed = Math.abs(ent.vx);
            const sameDir = Math.sign(ent.vx) === moveDir;
            if (!sameDir || curSpeed < maxSprintPx) {
              ent.vx += moveDir * airAccel * dt;
              if (sameDir && Math.abs(ent.vx) > maxSprintPx) ent.vx = moveDir * maxSprintPx;
            }
          }
        }

        // 5. VERTICAL GRAVITY (WITH AIR FAST-FALL)
        if (!ent.grounded && ent.state !== 'DASH_SKILL') {
          let grav = baseGravPx;
          if (ent.vy > 0) {
            grav *= PHYSICS.fallGravityMult;
            if (ent.state !== 'WALL_CLIMB') ent.state = 'FALL';
          } else if (ent.vy < 0 && !ent.ctrl.jumpHeld && ent.state === 'JUMP_RISE') {
            grav *= 1.40;
          }
          if (ent.ctrl.slideHeld) {
            grav *= 1.38;
          }
          ent.vy += grav * dt;
          if (ent.vy > 28 * PPM) ent.vy = 28 * PPM;
        }

        // 6. SWEPT AABB COLLISION RESOLUTION
        const wasGrounded = ent.grounded;
        let landedThisFrame = false;
        let touchingWallNormal = 0;

        ent.x += ent.vx * dt;

        // Red Destructible Walls (Breacher smashes right through!)
        const nearbyWalls = getNearbyBoxes(destructibleWalls, ent.x, 180);
        for (let i = 0; i < nearbyWalls.length; i++) {
          const cw = nearbyWalls[i];
          if (aabbOverlap(ent.x, ent.y, ent.w, ent.h, cw.x, cw.y, cw.w, cw.h)) {
            if (ent.archetype.canWallBash && (Math.abs(ent.vx) >= 4.0 * PPM || ent.state === 'DASH_SKILL')) {
              cw.rawRef.broken = true;
              cw.rawRef.respawnTimer = 6.0;
              ent.vx *= 0.94;
              addChainBonus(ent, 'WALL BASH!', '#ff2e55');
              spawnShockwave(cw.x + cw.w * 0.5, cw.y + cw.h * 0.5, '#ff2e55', 92);
              spawnWallDebris(cw, Math.sign(ent.vx) || ent.facing);
            } else {
              if (ent.vx > 0) { ent.x = cw.x - ent.w; touchingWallNormal = -1; }
              else if (ent.vx < 0) { ent.x = cw.x + cw.w; touchingWallNormal = 1; }
              ent.vx = 0;
            }
          }
        }

        // Waist-High Vault Crates (Auto-Vault vs 200ms Kong Vault)
        const nearbyCrates = getNearbyBoxes(vaultCrates, ent.x, 180);
        let didVault = false;
        for (let i = 0; i < nearbyCrates.length; i++) {
          const st = nearbyCrates[i];
          const lookAhead = ent.facing * 26;
          const nearFront = aabbOverlap(ent.x + lookAhead, ent.y, ent.w, ent.h, st.x, st.y, st.w, st.h);
          const overlapping = aabbOverlap(ent.x, ent.y, ent.w, ent.h, st.x, st.y, st.w, st.h);
          if ((overlapping || (nearFront && ent.vaultSnapTimer > 0)) && Math.abs(ent.vx) >= 2.8 * PPM) {
            const footY = ent.y + ent.h;
            if (footY > st.y + 8 && ent.y < st.y + 14) {
              const isKong = ent.vaultSnapTimer > 0 || ent.ctrl.jumpPressed;
              initiateVault(ent, st, isKong);
              didVault = true;
              break;
            }
          }
        }

        if (!didVault) {
          // Solid Geometry Horizontal Collisions
          const nearbySolids = getNearbyBoxes(solids, ent.x, 480);
          for (let i = 0; i < nearbySolids.length; i++) {
            const s = nearbySolids[i];
            if (aabbOverlap(ent.x, ent.y, ent.w, ent.h, s.x, s.y, s.w, s.h)) {
              const footY = ent.y + ent.h;
              const stepH = footY - s.y;
              if (stepH > 0 && stepH <= 16 && ent.grounded) {
                ent.y = s.y - ent.h;
                continue;
              }
              const ledgeDelta = s.y - (ent.y + 16);
              if (!ent.grounded && s.type !== 'tunnel' && ledgeDelta >= -24 && ledgeDelta <= 24 && Math.abs(ent.vx) > 22) {
                initiateMantle(ent, s, ent.vx > 0 ? 1 : -1);
                didVault = true;
                break;
              }
              if (ent.vx > 0) { ent.x = s.x - ent.w; touchingWallNormal = -1; }
              else if (ent.vx < 0) { ent.x = s.x + s.w; touchingWallNormal = 1; }
              ent.vx = 0;
            }
          }
        }

        if (!didVault) {
          // Vertical Step & Ramp Projection
          ent.y += ent.vy * dt;
          let groundedNow = false;

          const rampY = getRampSurfaceY(ent.x + ent.w * 0.5, ent.y + ent.h);
          if (rampY !== null && ent.vy >= 0) {
            ent.y = rampY - ent.h;
            ent.vy = 0;
            groundedNow = true;
          }

          const nearbySolidsV = getNearbyBoxes(solids, ent.x, 480);
          for (let i = 0; i < nearbySolidsV.length; i++) {
            const s = nearbySolidsV[i];
            if (aabbOverlap(ent.x, ent.y, ent.w, ent.h, s.x, s.y, s.w, s.h)) {
              if (ent.vy >= 0) {
                ent.y = s.y - ent.h;
                if (!wasGrounded && ent.vy > 4 * PPM) landedThisFrame = true;
                ent.vy = 0;
                groundedNow = true;
              } else if (ent.vy < 0) {
                ent.y = s.y + s.h;
                ent.vy = 0;
              }
            }
          }

          const nearbyCratesV = getNearbyBoxes(vaultCrates, ent.x, 180);
          for (let i = 0; i < nearbyCratesV.length; i++) {
            const st = nearbyCratesV[i];
            if (aabbOverlap(ent.x, ent.y, ent.w, ent.h, st.x, st.y, st.w, st.h) && ent.vy >= 0) {
              ent.y = st.y - ent.h;
              ent.vy = 0;
              groundedNow = true;
            }
          }

          // Bounce Pads Check
          const nearbyPads = getNearbyBoxes(bouncePads, ent.x, 180);
          for (let i = 0; i < nearbyPads.length; i++) {
            const bp = nearbyPads[i];
            if (aabbOverlap(ent.x, ent.y, ent.w, ent.h, bp.x, bp.y - 4, bp.w, bp.h + 4) && ent.vy >= 0) {
              ent.y = bp.y - ent.h;
              ent.vy = bp.boostVy;
              ent.grounded = false;
              ent.state = 'BOUNCE';
              ent.squashY = 1.30;
              bp.rawRef.pulse = 1.0;
              addChainBonus(ent, 'BOUNCE PAD!', '#10b981');
              spawnShockwave(bp.x + bp.w * 0.5, bp.y, '#10b981', 70);
              groundedNow = false;
            }
          }

          ent.grounded = groundedNow;
        }

        // 7. POST-COLLISION LANDING & WALL-CLIMB
        if (ent.grounded) {
          ent.coyoteTimer = PHYSICS.coyoteTimeSec;
          ent.wallKicksUsed = 0;
          ent.wallClimbTime = 0;

          if (landedThisFrame) {
            ent.squashY = 0.78;
            if (ent.slideBufferTimer > 0 || ent.ctrl.slideHeld) {
              enterSlideState(ent, moveDir, maxSprintPx);
            } else if (ent.state !== 'SLIDE') {
              ent.state = Math.abs(ent.vx) > 14 ? 'SPRINT' : 'IDLE';
            }
          }
        } else if (touchingWallNormal !== 0) {
          ent.lastWallNormal = touchingWallNormal;
          ent.wallCoyoteTimer = 0.14;
          const intoWall = (touchingWallNormal === -1 && ent.ctrl.right) || (touchingWallNormal === 1 && ent.ctrl.left);
          if (intoWall && ent.vy > -3.5 * PPM && ent.vy < 4.5 * PPM && ent.wallClimbTime < 0.55) {
            ent.state = 'WALL_CLIMB';
            ent.wallClimbTime += dt;
            ent.vy = -6.0 * PPM;
          }
        }

        // 8. SEAMLESS 220M WORLD WRAP & FINITE SANITIZATION
        if (ent.x >= WORLD_WIDTH) {
          ent.x -= WORLD_WIDTH;
          for (let i = 0; i < ent.scarf.length; i++) ent.scarf[i].x -= WORLD_WIDTH;
          if (ent === humanPlayer) camera.x -= WORLD_WIDTH;
        } else if (ent.x < 0) {
          ent.x += WORLD_WIDTH;
          for (let i = 0; i < ent.scarf.length; i++) ent.scarf[i].x += WORLD_WIDTH;
          if (ent === humanPlayer) camera.x += WORLD_WIDTH;
        }

        sanitizeEntity(ent);
        finalizeEntityAnimation(ent, dt, maxSprintPx);
      }

      function finalizeEntityAnimation(ent, dt, maxSprintPx) {
        ent.ctrl.jumpPressed = false;
        ent.ctrl.slidePressed = false;

        const speedPx = Math.abs(ent.vx);
        const speedMps = speedPx / PPM;

        if (ent.grounded && ent.state === 'SPRINT') {
          ent.stridePhase += dt * (6.5 + speedMps * 1.45);
        }

        const targetLean = ent.state === 'SKID'
          ? -ent.facing * 0.28
          : (ent.vx / Math.max(1, maxSprintPx)) * 0.22;
        ent.torsoLean += (targetLean - ent.torsoLean) * Math.min(1, dt * 14);

        // Update Flowing Multi-Segment Neon Scarf Ribbon
        const anchorX = ent.x + ent.w * 0.5 - ent.facing * 4;
        const anchorY = ent.y + (ent.state === 'SLIDE' ? 9 : 14);
        ent.scarf[0].x = anchorX;
        ent.scarf[0].y = anchorY;
        const segDist = 7.0;
        for (let i = 1; i < ent.scarf.length; i++) {
          const prev = ent.scarf[i - 1];
          const curr = ent.scarf[i];
          curr.x -= ent.facing * (40 + speedPx * 0.26) * dt;
          curr.y += (Math.sin(performance.now() * 0.012 + i * 1.1) * 20 + 26) * dt;

          const dx = curr.x - prev.x;
          const dy = curr.y - prev.y;
          const d = Math.hypot(dx, dy) || 0.001;
          if (d > segDist) {
            curr.x = prev.x + (dx / d) * segDist;
            curr.y = prev.y + (dy / d) * segDist;
          }
        }

        // Spawn Overdrive Ghost Afterimages
        if (speedPx > maxSprintPx * 1.03 || ent.state === 'KONG_VAULT' || ent.state === 'LONG_JUMP' || ent.state === 'DASH_SKILL' || ent.state === 'BOUNCE') {
          ent.ghostTimer -= dt;
          if (ent.ghostTimer <= 0) {
            ent.ghostTimer = 0.04;
            if (afterimages.length > 45) afterimages.shift();
            const trailColor = ent.role === 'CHASER' ? COLORS.chaser : ent.archetype.accent;
            afterimages.push({
              x: ent.x,
              y: ent.y,
              w: ent.w,
              h: ent.h,
              facing: ent.facing,
              lean: ent.torsoLean,
              state: ent.state,
              color: trailColor,
              life: 0.24,
              maxLife: 0.24,
            });
          }
        }
      }

      // =======================================================================
      // 11. TAG ARENA RULES, SONAR SWEEP & CHASER POWER-UPS
      // =======================================================================
      const CHASER_POWERUPS = [
        { id: 'OVERDRIVE', label: 'OVERDRIVE SPEED' },
        { id: 'LONG_ARM',  label: 'LONG-ARM REACH' },
        { id: 'SKYBOUND',  label: 'SKYBOUND JUMP' },
      ];

      function updateTagAndMatchRules(dt) {
        for (let i = 0; i < bouncePads.length; i++) {
          if (bouncePads[i].pulse > 0) {
            bouncePads[i].pulse = Math.max(0, bouncePads[i].pulse - dt * 3.0);
          }
        }

        for (let i = 0; i < destructibleWalls.length; i++) {
          const cw = destructibleWalls[i];
          if (cw.broken) {
            cw.respawnTimer -= dt;
            if (cw.respawnTimer <= 0) {
              cw.broken = false;
              spawnShockwave(cw.x + cw.w * 0.5, cw.y + cw.h * 0.5, '#ff2e55', 52);
            }
          }
        }

        for (let i = entities.length - 1; i >= 0; i--) {
          if (entities[i].isDecoy && entities[i].decoyLife <= 0) {
            spawnShockwave(entities[i].x + 13, entities[i].y + 26, '#a855f7', 42);
            entities.splice(i, 1);
          }
        }

        // Sonar Pulse Sweep
        gameState.sonarTimer -= dt;
        if (gameState.sonarTimer <= 0) {
          gameState.sonarTimer = PHYSICS.sonarInterval;
          gameState.sonarRevealTimer = 3.8;
          const chaser = entities.find((e) => e.role === 'CHASER') || humanPlayer;
          if (chaser) {
            gameState.sonarRings.push({
              x: chaser.x + chaser.w * 0.5,
              y: chaser.y + chaser.h * 0.5,
              radius: 18,
              life: 1.6,
              maxLife: 1.6,
            });
          }
        }
        if (gameState.sonarRevealTimer > 0) {
          gameState.sonarRevealTimer = Math.max(0, gameState.sonarRevealTimer - dt);
        }
        for (let i = gameState.sonarRings.length - 1; i >= 0; i--) {
          const ring = gameState.sonarRings[i];
          ring.life -= dt;
          if (ring.life <= 0) {
            gameState.sonarRings.splice(i, 1);
          } else {
            ring.radius += 1350 * dt;
          }
        }

        // Tag Collision Check (TAG ARENA mode)
        if (gameState.mode === 'ARENA' && !gameState.roundOver) {
          const chaser = entities.find((e) => e.role === 'CHASER');
          if (chaser) {
            const reachBonus = chaser.activePowerup === 'LONG_ARM' ? 36 : 0;
            const tagRadiusX = 36 + reachBonus;
            const tagRadiusY = 52 + reachBonus * 0.5;

            for (let i = 0; i < entities.length; i++) {
              const target = entities[i];
              if (target === chaser || target.role !== 'RUNNER' || target.taggedOut || target.spawnProtection > 0) continue;

              const dx = Math.abs(wrappedDeltaX(chaser.x + chaser.w * 0.5, target.x + target.w * 0.5));
              const dy = Math.abs((chaser.y + chaser.h * 0.5) - (target.y + target.h * 0.5));

              if (dx <= tagRadiusX && dy <= tagRadiusY) {
                if (target.isDecoy) {
                  target.decoyLife = 0;
                  spawnPopup(target.x + 13, target.y - 20, 'HOLO DECOY BUSTED!', '#a855f7');
                  spawnShockwave(target.x + 13, target.y + 26, '#a855f7', 72);
                  continue;
                }

                target.taggedOut = true;
                target.respawnTimer = 2.0;
                target.vx = 0;
                target.vy = 0;
                chaser.skillCharge = Math.min(1.0, chaser.skillCharge + 0.35);

                const picked = CHASER_POWERUPS[Math.floor(Math.random() * CHASER_POWERUPS.length)];
                chaser.activePowerup = picked.id;
                chaser.powerupTimer = 10.0;

                spawnShockwave(target.x + target.w * 0.5, target.y + target.h * 0.5, '#ff2e55', 105);
                spawnPopup(target.x + target.w * 0.5, target.y - 24, `TAGGED! +${picked.label}`, '#ff2e55');
                for (let p = 0; p < 18; p++) {
                  spawnParticle(
                    target.x + target.w * 0.5,
                    target.y + target.h * 0.5,
                    (Math.random() - 0.5) * 420,
                    -90 - Math.random() * 280,
                    p % 2 === 0 ? '#ff2e55' : '#00f0ff',
                    3.8,
                    0.55,
                    580
                  );
                }
              }
            }
          }

          gameState.roundTimeRemaining = Math.max(0, gameState.roundTimeRemaining - dt);
          let realCount = 0;
          let aliveCount = 0;
          for (let i = 0; i < entities.length; i++) {
            if (entities[i].role === 'RUNNER' && !entities[i].isDecoy) {
              realCount++;
              if (!entities[i].taggedOut) aliveCount++;
            }
          }

          if (realCount > 0 && aliveCount === 0) {
            triggerRoundOver('CHASER WINS!', 'All runners were tagged before the clock expired.', '#ff2e55');
          } else if (gameState.roundTimeRemaining <= 0) {
            triggerRoundOver('RUNNERS WIN!', `${aliveCount} runner(s) survived the full round!`, '#00f0ff');
          }
        }
      }

      function triggerRoundOver(title, desc, color) {
        gameState.roundOver = true;
        const banner = document.getElementById('roundResultBanner');
        document.getElementById('roundResultTag').style.color = color;
        document.getElementById('roundResultTitle').textContent = title;
        document.getElementById('roundResultDesc').textContent = desc;
        banner.classList.remove('hidden');
      }

      // =======================================================================
      // 12. CAMERA TRACKING & PER-FRAME DYNAMIC CANVAS VERIFICATION
      // =======================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let viewW = 800;
      let viewH = 450;
