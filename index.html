      function ensureCanvasMatchesViewport() {
        const w = Math.max(300, window.innerWidth || document.documentElement.clientWidth || 800);
        const h = Math.max(200, window.innerHeight || document.documentElement.clientHeight || 450);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.floor(w * dpr);
        const targetH = Math.floor(h * dpr);

        if (canvas.width !== targetW || canvas.height !== targetH || viewW !== w || viewH !== h) {
          viewW = w;
          viewH = h;
          canvas.width = targetW;
          canvas.height = targetH;

          const banner = document.getElementById('portraitBanner');
          if (!gameState.hudHidden && !gameState.portraitDismissed && viewH > viewW) {
            banner.classList.remove('hidden');
          } else {
            banner.classList.add('hidden');
          }
        }

        // Always reset transform at the start of every frame so DPR/translations never compound
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }

      function updateCamera(dt) {
        if (!humanPlayer) return;
        sanitizeEntity(humanPlayer);

        const maxSprintPx = getEffectiveMaxSprintPx(humanPlayer);
        const speedRatio = Math.min(1.6, Math.abs(humanPlayer.vx) / Math.max(1, maxSprintPx));

        const lookAheadX = humanPlayer.facing * (120 + speedRatio * 150);
        const targetX = humanPlayer.x + humanPlayer.w * 0.5 + lookAheadX;
        const targetY = humanPlayer.y + humanPlayer.h * 0.5 - 55;

        const baseZoom = viewW >= viewH ? 0.92 : 0.74;
        const targetZoom = baseZoom - Math.max(0, speedRatio - 0.5) * 0.12;

        if (!Number.isFinite(camera.x)) camera.x = targetX;
        if (!Number.isFinite(camera.y)) camera.y = targetY;
        if (!Number.isFinite(camera.zoom)) camera.zoom = baseZoom;

        camera.x += (targetX - camera.x) * Math.min(1, dt * 9.0);
        camera.y += (targetY - camera.y) * Math.min(1, dt * 7.5);
        camera.zoom += (targetZoom - camera.zoom) * Math.min(1, dt * 4.5);
      }

      // =======================================================================
      // 13. ARTICULATED CHARACTER RENDERER & ARENA SCENE
      // =======================================================================
      function render() {
        ensureCanvasMatchesViewport();

        // 1. Deep Atmospheric Cyberpunk Sky
        const skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
        skyGrad.addColorStop(0, '#070a10');
        skyGrad.addColorStop(0.62, '#0c1322');
        skyGrad.addColorStop(1, '#111a2e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, viewW, viewH);

        ctx.save();
        ctx.translate(viewW * 0.5, viewH * 0.60);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        const halfSpanX = (viewW * 0.72) / camera.zoom;
        const leftVis = camera.x - halfSpanX;
        const rightVis = camera.x + halfSpanX;

        // 2. Parallax Skyline Buildings with Neon Windows
        for (let bx = Math.floor(leftVis / 280) * 280; bx <= rightVis + 280; bx += 280) {
          const hash = Math.abs(Math.sin(bx * 0.013));
          const bh = 160 + hash * 195;
          ctx.fillStyle = '#0e1628';
          ctx.fillRect(bx, WORLD_FLOOR_Y - bh, 195, bh);
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, WORLD_FLOOR_Y - bh, 195, bh);

          ctx.fillStyle = hash > 0.5 ? 'rgba(0, 240, 255, 0.16)' : 'rgba(168, 85, 247, 0.16)';
          for (let wy = WORLD_FLOOR_Y - bh + 24; wy < WORLD_FLOOR_Y - 32; wy += 36) {
            ctx.fillRect(bx + 22, wy, 38, 4);
            ctx.fillRect(bx + 80, wy, 50, 4);
          }
        }

        // 3. Spatial Meter Grid (1m = 42px)
        const firstM = Math.floor(leftVis / PPM);
        const lastM = Math.ceil(rightVis / PPM);
        ctx.lineWidth = 1;
        for (let m = firstM; m <= lastM; m++) {
          const gx = m * PPM;
          const wrappedM = ((m % WORLD_METERS) + WORLD_METERS) % WORLD_METERS;
          const isMajor = wrappedM % 10 === 0;
          ctx.strokeStyle = isMajor ? 'rgba(0, 240, 255, 0.14)' : 'rgba(51, 65, 85, 0.22)';
          ctx.beginPath();
          ctx.moveTo(gx, -180);
          ctx.lineTo(gx, WORLD_FLOOR_Y + 240);
          ctx.stroke();

          if (isMajor) {
            ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
            ctx.font = '600 11px "JetBrains Mono", monospace';
            ctx.fillText(`${wrappedM}m`, gx + 5, WORLD_FLOOR_Y + 20);
          }
        }

        // 4. Seamless Looping 220m Parkour Track Geometry
        for (let offset = -WORLD_WIDTH; offset <= WORLD_WIDTH; offset += WORLD_WIDTH) {
          for (let i = 0; i < solids.length; i++) {
            const s = solids[i];
            const sx = s.x + offset;
            if (sx + s.w < leftVis || sx > rightVis) continue;

            if (s.type === 'tunnel') {
              ctx.fillStyle = '#121c30';
              ctx.fillRect(sx, s.y, s.w, s.h);
              ctx.strokeStyle = '#00f0ff';
              ctx.lineWidth = 1.8;
              ctx.strokeRect(sx, s.y, s.w, s.h);

              ctx.fillStyle = '#00f0ff';
              ctx.font = '700 11px "JetBrains Mono", monospace';
              for (let cx = sx + 24; cx < sx + s.w - 22; cx += 62) {
                ctx.fillText('▼ SLIDE', cx, s.y + s.h - 8);
              }
            } else if (s.type === 'wall') {
              ctx.fillStyle = '#162033';
              ctx.fillRect(sx, s.y, s.w, s.h);
              ctx.strokeStyle = '#475569';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(sx, s.y, s.w, s.h);

              // Glowing Emerald Wall-Kick Grip Strips
              ctx.fillStyle = '#10b981';
              ctx.fillRect(sx - 2, s.y + 12, 3, s.h - 24);
              ctx.fillRect(sx + s.w - 1, s.y + 12, 3, s.h - 24);
            } else if (s.type === 'rooftop') {
              ctx.fillStyle = '#152036';
              ctx.fillRect(sx, s.y, s.w, s.h);
              ctx.fillStyle = '#10b981';
              ctx.fillRect(sx, s.y, s.w, 3);
            } else {
              ctx.fillStyle = '#101828';
              ctx.fillRect(sx, s.y, s.w, s.h);
              ctx.fillStyle = '#00f0ff';
              ctx.fillRect(sx, s.y, s.w, 3);
            }
          }

          // Angled Launch Ramps
          for (let i = 0; i < ramps.length; i++) {
            const r = ramps[i];
            const x1 = r.x1 + offset;
            const x2 = r.x2 + offset;
            if (x2 < leftVis || x1 > rightVis) continue;
            ctx.fillStyle = '#152036';
            ctx.beginPath();
            ctx.moveTo(x1, r.y1);
            ctx.lineTo(x2, r.y2);
            ctx.lineTo(x2, r.y1);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x1, r.y1);
            ctx.lineTo(x2, r.y2);
            ctx.stroke();
          }

          // Waist-High Vault Crates / Market Stalls
          for (let i = 0; i < vaultCrates.length; i++) {
            const st = vaultCrates[i];
            const vx = st.x + offset;
            if (vx + st.w < leftVis || vx > rightVis) continue;

            ctx.fillStyle = 'rgba(245, 158, 11, 0.22)';
            ctx.fillRect(vx, st.y, st.w, st.h);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(vx, st.y, st.w, st.h);

            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(vx - 2, st.y, st.w + 4, 4);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(vx + st.w * 0.5, st.y + 8, st.w * 0.72, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Spring Bounce Pads
          for (let i = 0; i < bouncePads.length; i++) {
            const bp = bouncePads[i];
            const bx = bp.x + offset;
            if (bx + bp.w < leftVis || bx > rightVis) continue;

            const lift = bp.pulse * 6;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(bx, bp.y + 4, bp.w, bp.h - 4);
            ctx.fillStyle = '#10b981';
            ctx.fillRect(bx - 2, bp.y - lift, bp.w + 4, 5);
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(bx - 2, bp.y - lift, bp.w + 4, 5);
          }

          // Red Destructible Breacher Walls
          for (let i = 0; i < destructibleWalls.length; i++) {
            const cw = destructibleWalls[i];
            if (cw.broken) continue;
            const bx = cw.x + offset;
            if (bx + cw.w < leftVis || bx > rightVis) continue;

            ctx.fillStyle = 'rgba(255, 46, 85, 0.25)';
            ctx.fillRect(bx, cw.y, cw.w, cw.h);
            ctx.strokeStyle = '#ff2e55';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, cw.y, cw.w, cw.h);

            ctx.strokeStyle = '#fda4af';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(bx + 6, cw.y + 10);
            ctx.lineTo(bx + cw.w - 7, cw.y + 36);
            ctx.lineTo(bx + 8, cw.y + 62);
            ctx.lineTo(bx + cw.w - 6, cw.y + 88);
            ctx.stroke();
          }
        }

        // 5. Sonar Pulse Radar Sweep Rings
        for (let i = 0; i < gameState.sonarRings.length; i++) {
          const ring = gameState.sonarRings[i];
          const alpha = (ring.life / ring.maxLife) * 0.65;
          ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 6. Ghost Afterimages
        for (let i = 0; i < afterimages.length; i++) {
          const g = afterimages[i];
          const alpha = (g.life / g.maxLife) * 0.34;
          drawArticulatedCharacter(g, alpha, true);
        }

        // 7. All Characters (Human Player + 4 AI Bots + Decoys)
        for (let i = 0; i < entities.length; i++) {
          const ent = entities[i];
          if (ent.taggedOut) continue;
          const baseAlpha = ent.stealthTimer > 0 ? (ent.isHuman ? 0.45 : 0.20) : 1.0;

          for (let offset = -WORLD_WIDTH; offset <= WORLD_WIDTH; offset += WORLD_WIDTH) {
            const drawX = ent.x + offset;
            if (drawX + 70 < leftVis || drawX - 70 > rightVis) continue;
            drawArticulatedCharacter({ ...ent, x: drawX }, baseAlpha, false);
          }
        }

        // 8. Shockwaves, Particles & Floating Callouts
        for (let i = 0; i < shockwaves.length; i++) {
          const sw = shockwaves[i];
          const t = 1 - sw.life / sw.maxLife;
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = (1 - t) * 0.85;
          ctx.lineWidth = 2.6 * (1 - t);
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius + (sw.maxRadius - sw.radius) * t, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < popups.length; i++) {
          const pop = popups[i];
          ctx.globalAlpha = Math.min(1, (pop.life / pop.maxLife) * 1.4);
          ctx.font = '800 13px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#090c12';
          ctx.fillText(pop.text, pop.x + 1, pop.y + 1);
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.textAlign = 'left';
        }
        ctx.globalAlpha = 1;

        ctx.restore();

        // 9. Screen-Space Off-Screen Edge Indicators (Distance Badges in Meters)
        renderEdgeIndicators();
      }

      function drawArticulatedCharacter(ent, alpha, isGhost) {
        ctx.save();
        ctx.globalAlpha = alpha;

        const isChaser = ent.role === 'CHASER';
        const roleColor = isChaser ? COLORS.chaser : (ent.isHuman ? COLORS.gold : COLORS.runner);
        const accentColor = isChaser ? COLORS.chaser : ent.archetype.accent;
        const cx = ent.x + ent.w * 0.5;
        const bottomY = ent.y + ent.h;

        // 1. Grounded Contact Shadow on surface beneath character
        if (!isGhost) {
          const shadowY = findGroundShadowY(ent);
          const heightAbove = Math.max(0, shadowY - bottomY);
          const shadowScale = Math.max(0.35, 1 - heightAbove / 280);
          ctx.fillStyle = `rgba(0, 0, 0, ${0.48 * shadowScale})`;
          ctx.beginPath();
          ctx.ellipse(cx, shadowY, 15 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Flowing Multi-Segment Velocity Scarf Trail
        if (!isGhost && ent.scarf && ent.scarf.length > 1) {
          const offsetX = ent.x - ent.scarf[0].x;
          ctx.strokeStyle = roleColor;
          ctx.lineWidth = 4.2;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(ent.scarf[0].x + offsetX, ent.scarf[0].y);
          for (let i = 1; i < ent.scarf.length; i++) {
            ctx.lineTo(ent.scarf[i].x + offsetX, ent.scarf[i].y);
          }
          ctx.stroke();
        }

        // 3. Chaser Danger Aura & Power-Up Rings
        if (!isGhost && isChaser) {
          const reachR = ent.activePowerup === 'LONG_ARM' ? 72 : 38;
          ctx.strokeStyle = ent.activePowerup === 'LONG_ARM' ? 'rgba(255, 46, 85, 0.65)' : 'rgba(255, 46, 85, 0.30)';
          ctx.lineWidth = ent.activePowerup === 'LONG_ARM' ? 2.2 : 1.3;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.arc(cx, ent.y + ent.h * 0.5, reachR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.translate(cx, bottomY);
        if (!isGhost && ent.squashY) {
          ctx.scale(1 / ent.squashY, ent.squashY);
        }

        if (ent.state === 'SLIDE') {
          // Low Aerodynamic Slide Pose
          ctx.rotate(-ent.facing * 0.98);
          ctx.fillStyle = isGhost ? accentColor : '#f1f5f9';
          drawRoundRect(ctx, -6, -33, 12, 24, 5, true, false);

          // Extended lead leg
          ctx.strokeStyle = isGhost ? accentColor : '#94a3b8';
          ctx.lineWidth = 4.8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(ent.facing * 16, -2);
          ctx.stroke();

          // Head, Headband & Visor
          ctx.fillStyle = isGhost ? accentColor : '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -39, 6.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = roleColor;
          ctx.fillRect(-6, -43, 12, 2.5);
          ctx.fillRect(ent.facing > 0 ? 1 : -6, -40, 5.5, 3);
        } else if (ent.state === 'KONG_VAULT') {
          // Forward Vault Flip Arc Pose
          ctx.rotate(ent.facing * 1.24);
          ctx.fillStyle = isGhost ? accentColor : '#f1f5f9';
          drawRoundRect(ctx, -6, -37, 12, 26, 5, true, false);
          ctx.fillStyle = isGhost ? accentColor : '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -44, 6.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = roleColor;
          ctx.fillRect(ent.facing > 0 ? 1 : -6, -46, 5.5, 3);
        } else {
          // Articulated Running / Jumping Rig
          ctx.rotate(ent.torsoLean || 0);
          const swing = ent.state === 'SPRINT' ? Math.sin(ent.stridePhase || 0) : (ent.state === 'IDLE' ? 0 : 0.65);

          // Back Leg
          ctx.strokeStyle = isGhost ? accentColor : '#64748b';
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -22);
          ctx.lineTo(-ent.facing * swing * 12, -2);
          ctx.stroke();

          // Front Leg
          ctx.strokeStyle = isGhost ? accentColor : '#cbd5e1';
          ctx.beginPath();
          ctx.moveTo(0, -22);
          ctx.lineTo(ent.facing * swing * 13, -2);
          ctx.stroke();

          // Torso
          ctx.fillStyle = isGhost ? accentColor : '#f8fafc';
          drawRoundRect(ctx, -6.5, -42, 13, 22, 5, true, false);

          // Archetype Chest Stripe
          if (!isGhost) {
            ctx.fillStyle = accentColor;
            ctx.fillRect(ent.facing > 0 ? 1.5 : -5.5, -38, 4, 12);
          }

          // Pumping Arm
          ctx.strokeStyle = isGhost ? accentColor : '#e2e8f0';
          ctx.lineWidth = 3.8;
          ctx.beginPath();
          ctx.moveTo(0, -37);
          ctx.lineTo(-ent.facing * swing * 11, -24);
          ctx.stroke();

          // Head, Headband & Directional Visor
          ctx.fillStyle = isGhost ? accentColor : '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -49, 6.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = roleColor;
          ctx.fillRect(-6.5, -53, 13, 2.5);
          ctx.fillRect(ent.facing > 0 ? 1.5 : -6.5, -50, 5.5, 3);
        }

        ctx.restore();

        // 4. Crisp Floating Nameplate (`YOU`, `CHASER`, `BOT 1..4`)
        if (!isGhost && !gameState.hudHidden) {
          ctx.save();
          ctx.font = '800 11px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          const label = ent.isHuman
            ? `▼ YOU (${ent.role})`
            : (isChaser ? '★ CHASER' : ent.name);
          ctx.fillStyle = '#090c12';
          ctx.fillText(label, cx + 1, ent.y - 11);
          ctx.fillStyle = ent.isHuman ? COLORS.gold : (isChaser ? COLORS.chaser : COLORS.runner);
          ctx.fillText(label, cx, ent.y - 12);
          ctx.restore();
        }
      }

      function renderEdgeIndicators() {
        if (!humanPlayer || gameState.hudHidden) return;

        for (let i = 0; i < entities.length; i++) {
          const other = entities[i];
          if (other === humanPlayer || other.taggedOut) continue;

          const isChaser = other.role === 'CHASER';
          const shouldShow = isChaser || humanPlayer.role === 'CHASER' || gameState.sonarRevealTimer > 0 || gameState.mode === 'SANDBOX';
          if (!shouldShow) continue;

          const dx = wrappedDeltaX(humanPlayer.x, other.x);
          const screenX = viewW * 0.5 + (dx - (camera.x - humanPlayer.x)) * camera.zoom;

          if (screenX < 38 || screenX > viewW - 38) {
            const clampedX = Math.max(48, Math.min(viewW - 48, screenX));
            const isLeft = screenX < viewW * 0.5;
            const distM = Math.round(Math.abs(dx) / PPM);
            const badgeColor = isChaser ? COLORS.chaser : COLORS.runner;
            const tagText = isChaser ? 'CHASER' : other.name;

            ctx.save();
            ctx.fillStyle = 'rgba(9, 12, 18, 0.92)';
            ctx.strokeStyle = badgeColor;
            ctx.lineWidth = 1.6;
            drawRoundRect(ctx, clampedX - 44, viewH * 0.44 - 14, 88, 28, 14, true, true);

            ctx.fillStyle = badgeColor;
            ctx.font = '800 10px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            const arrow = isLeft ? `◀ ${tagText} ${distM}m` : `${tagText} ${distM}m ▶`;
            ctx.fillText(arrow, clampedX, viewH * 0.44 + 4);
            ctx.restore();
          }
        }
      }

      // =======================================================================
      // 14. HUD & 220M ARENA RADAR SYNCHRONIZATION
      // =======================================================================
      const radarDotsLayer = document.getElementById('radarDotsLayer');

      function updateHUD() {
        if (gameState.hudHidden || !humanPlayer) return;

        const speedMps = Math.abs(humanPlayer.vx) / PPM;
        document.getElementById('topSpeedVal').textContent = `${speedMps.toFixed(1)} m/s`;

        const stateEl = document.getElementById('topStateBadge');
        stateEl.textContent = humanPlayer.state.replace('_', ' ');
        stateEl.style.color = humanPlayer.state === 'SLIDE' || humanPlayer.state === 'KONG_VAULT'
          ? COLORS.runner
          : (humanPlayer.state === 'LONG_JUMP' ? COLORS.gold : COLORS.parkour);

        const chaser = entities.find((e) => e.role === 'CHASER');
        const powerupWrap = document.getElementById('statusPowerupWrap');
        const statusPowerup = document.getElementById('statusPowerup');
        if (chaser && chaser.activePowerup) {
          powerupWrap.classList.remove('hidden');
          statusPowerup.textContent = `${chaser.activePowerup} (${chaser.powerupTimer.toFixed(1)}s)`;
        } else {
          powerupWrap.classList.add('hidden');
        }

        const statusSonar = document.getElementById('statusSonar');
        if (gameState.sonarRevealTimer > 0) {
          statusSonar.textContent = `REVEAL ${gameState.sonarRevealTimer.toFixed(1)}s`;
          statusSonar.style.color = COLORS.runner;
        } else {
          statusSonar.textContent = `${gameState.sonarTimer.toFixed(1)}s`;
          statusSonar.style.color = COLORS.parkour;
        }

        let realCount = 0;
        let aliveCount = 0;
        for (let i = 0; i < entities.length; i++) {
          if (entities[i].role === 'RUNNER' && !entities[i].isDecoy) {
            realCount++;
            if (!entities[i].taggedOut) aliveCount++;
          }
        }
        document.getElementById('statusRunnersAlive').textContent = `${aliveCount}/${realCount}`;

        const timerWrap = document.getElementById('statusRoundTimerWrap');
        if (gameState.mode === 'ARENA') {
          timerWrap.classList.remove('hidden');
          const mins = Math.floor(gameState.roundTimeRemaining / 60);
          const secs = Math.floor(gameState.roundTimeRemaining % 60);
          document.getElementById('statusRoundTimer').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        } else {
          timerWrap.classList.add('hidden');
        }

        // Update 220m Arena Radar Dots
        let radarHtml = '';
        for (let i = 0; i < entities.length; i++) {
          const ent = entities[i];
          if (ent.taggedOut) continue;
          const pct = (wrapX(ent.x) / WORLD_WIDTH) * 100;
          const dotColor = ent.isHuman ? '#fbbf24' : (ent.role === 'CHASER' ? '#ff2e55' : '#00f0ff');
          const sizeClass = ent.isHuman ? 'w-2.5 h-2.5 -mt-[5px] ring-1 ring-white' : 'w-2 h-2 -mt-[4px]';
          radarHtml += `<span class="absolute top-1/2 -translate-x-1/2 rounded-full ${sizeClass}" style="left:${pct.toFixed(1)}%;background:${dotColor};"></span>`;
        }
        radarDotsLayer.innerHTML = radarHtml;

        // Combo Chain & Slide-Hop Sweet-Spot Bar
        const chainPill = document.getElementById('hudChainPill');
        if (humanPlayer.chainCount > 0) {
          chainPill.textContent = `CHAIN x${humanPlayer.chainCount}`;
          chainPill.classList.remove('hidden');
        } else {
          chainPill.classList.add('hidden');
        }

        const slideHopBox = document.getElementById('slideHopCueBox');
        if (humanPlayer.state === 'SLIDE') {
          slideHopBox.classList.remove('hidden');
          const pct = Math.min(100, (humanPlayer.slideTime / 0.65) * 100);
          document.getElementById('slideHopCursor').style.left = `${pct.toFixed(1)}%`;
        } else {
          slideHopBox.classList.add('hidden');
        }

        // Special Skill Charge Bar
        const skillNameEl = document.getElementById('hudSkillName');
        const skillFillEl = document.getElementById('hudSkillFill');
        skillNameEl.textContent = humanPlayer.archetype.skillName;
        skillFillEl.style.width = `${Math.round(humanPlayer.skillCharge * 100)}%`;
        if (humanPlayer.skillCharge >= 1.0) {
          skillNameEl.style.color = humanPlayer.archetype.accent;
          skillFillEl.style.backgroundColor = humanPlayer.archetype.accent;
        } else {
          skillNameEl.style.color = '#64748b';
          skillFillEl.style.backgroundColor = '#475569';
        }
      }

      function refreshTopBarStyles() {
        const btnMode = document.getElementById('btnModeToggle');
        if (gameState.mode === 'ARENA') {
          btnMode.textContent = 'TAG ARENA';
          btnMode.style.borderColor = 'rgba(255, 46, 85, 0.65)';
          btnMode.style.backgroundColor = 'rgba(255, 46, 85, 0.18)';
          btnMode.style.color = '#ff2e55';
        } else {
          btnMode.textContent = 'FREE SANDBOX';
          btnMode.style.borderColor = 'rgba(16, 185, 129, 0.65)';
          btnMode.style.backgroundColor = 'rgba(16, 185, 129, 0.18)';
          btnMode.style.color = '#10b981';
        }

        const btnRole = document.getElementById('btnRoleToggle');
        const roleDot = document.getElementById('roleDot');
        const roleLabel = document.getElementById('roleLabel');
        if (gameState.humanRole === 'CHASER') {
          btnRole.style.borderColor = 'rgba(255, 46, 85, 0.6)';
          btnRole.style.backgroundColor = 'rgba(255, 46, 85, 0.16)';
          btnRole.style.color = '#ff2e55';
          roleDot.style.backgroundColor = '#ff2e55';
          roleLabel.textContent = 'CHASER';
        } else {
          btnRole.style.borderColor = 'rgba(0, 240, 255, 0.6)';
          btnRole.style.backgroundColor = 'rgba(0, 240, 255, 0.16)';
          btnRole.style.color = '#00f0ff';
          roleDot.style.backgroundColor = '#00f0ff';
          roleLabel.textContent = 'RUNNER';
        }

        document.querySelectorAll('.arch-btn').forEach((btn) => {
          const key = btn.dataset.arch;
          const arch = ARCHETYPES[key];
          if (key === gameState.humanArchetype) {
            btn.style.borderColor = arch.accent;
            btn.style.backgroundColor = arch.accent + '28';
            btn.style.color = '#ffffff';
          } else {
            btn.style.borderColor = '#1e293b';
            btn.style.backgroundColor = 'transparent';
            btn.style.color = '#94a3b8';
          }
        });
      }

      function setHumanArchetype(archKey) {
        if (!ARCHETYPES[archKey]) return;
        gameState.humanArchetype = archKey;
        if (humanPlayer) {
          humanPlayer.archetypeKey = archKey;
          humanPlayer.archetype = ARCHETYPES[archKey];
          humanPlayer.skillCharge = 1.0;
          spawnShockwave(humanPlayer.x + 13, humanPlayer.y + 28, ARCHETYPES[archKey].accent, 58);
        }
        refreshTopBarStyles();
      }

      function initMatch() {
        gameState.roundTimeRemaining = 120.0;
        gameState.roundOver = false;
        gameState.sonarTimer = PHYSICS.sonarInterval;
        gameState.sonarRevealTimer = 0;
        gameState.sonarRings.length = 0;
        particles.length = 0;
        afterimages.length = 0;
        shockwaves.length = 0;
        popups.length = 0;
        for (let i = 0; i < destructibleWalls.length; i++) {
          destructibleWalls[i].broken = false;
          destructibleWalls[i].respawnTimer = 0;
        }
        document.getElementById('roundResultBanner').classList.add('hidden');
        rebuildEntities();
        refreshTopBarStyles();
      }

      document.getElementById('btnModeToggle').addEventListener('click', () => {
        gameState.mode = gameState.mode === 'ARENA' ? 'SANDBOX' : 'ARENA';
        initMatch();
      });

      document.getElementById('btnRoleToggle').addEventListener('click', () => {
        gameState.humanRole = gameState.humanRole === 'RUNNER' ? 'CHASER' : 'RUNNER';
        initMatch();
      });

      document.querySelectorAll('.arch-btn').forEach((btn) => {
        btn.addEventListener('click', () => setHumanArchetype(btn.dataset.arch));
      });

      document.getElementById('hudSkillBtn').addEventListener('click', triggerHumanSkill);
      document.getElementById('btnResetMatch').addEventListener('click', initMatch);
      document.getElementById('btnNextRound').addEventListener('click', initMatch);

      // Isolated HIDE HUD / SHOW HUD toggle
      const hudRoot = document.getElementById('hudRoot');
      const btnShowHudOnly = document.getElementById('btnShowHudOnly');
      document.getElementById('btnHideHud').addEventListener('click', () => {
        gameState.hudHidden = true;
        hudRoot.classList.add('hidden');
        document.getElementById('portraitBanner').classList.add('hidden');
        btnShowHudOnly.classList.remove('hidden');
      });
      btnShowHudOnly.addEventListener('click', () => {
        gameState.hudHidden = false;
        btnShowHudOnly.classList.add('hidden');
        hudRoot.classList.remove('hidden');
      });

      document.getElementById('btnDismissPortrait').addEventListener('click', () => {
        gameState.portraitDismissed = true;
        document.getElementById('portraitBanner').classList.add('hidden');
      });

      // =======================================================================
      // 15. MAIN SIMULATION LOOP (4 PHYSICS SUB-STEPS PER FRAME)
      // =======================================================================
      function updateVFX(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
        for (let i = afterimages.length - 1; i >= 0; i--) {
          afterimages[i].life -= dt;
          if (afterimages[i].life <= 0) afterimages.splice(i, 1);
        }
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          shockwaves[i].life -= dt;
          if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
        }
        for (let i = popups.length - 1; i >= 0; i--) {
          const pop = popups[i];
          pop.life -= dt;
          pop.y += pop.vy * dt;
          pop.vy *= 0.94;
          if (pop.life <= 0) popups.splice(i, 1);
        }
      }

      let lastTime = 0;
      let started = false;

      function gameLoop(now) {
        if (!lastTime) lastTime = now;
        const dt = Math.min(0.033, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        try {
          if (humanPlayer) {
            humanPlayer.ctrl.left = rawInput.left;
            humanPlayer.ctrl.right = rawInput.right;
            humanPlayer.ctrl.slideHeld = rawInput.slideHeld;
            humanPlayer.ctrl.jumpHeld = rawInput.jumpHeld;
          }

          const subDt = dt / SUBSTEPS;
          for (let step = 0; step < SUBSTEPS; step++) {
            for (let i = 0; i < entities.length; i++) {
              const ent = entities[i];
              if (!ent.isHuman) {
                updateAIBot(ent, subDt);
              }
              stepEntityPhysics(ent, subDt);
            }
            updateTagAndMatchRules(subDt);
            updateVFX(subDt);
          }

          updateCamera(dt);
          render();
          updateHUD();
        } catch (err) {
          console.error('Frame error recovered:', err);
        }

        requestAnimationFrame(gameLoop);
      }

      function startApp() {
        if (started) return;
        started = true;
        initMatch();
        render(); // Render Frame 0 immediately with camera locked onto player spawn
        requestAnimationFrame(gameLoop);
      }

      window.addEventListener('load', startApp);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        startApp();
      }
    })();
  </script>
</body>
